<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Animal band · Оркестр · Orķestris</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap">
<style>
/* layout: Sofia dances on the left; the instrument fills the right; tabs for the three instruments on top;
   songs to play along at the bottom. Free play: there are no wrong notes. */
:root{
  --ink:#24352b; --card:#fffdf6; --pink:#f06292;
  --display:"Nunito","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
  --sh:min(54vh,460px,90vw); --sw:calc(var(--sh)*.4624); --sx:max(12px,3vw);
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:#2b2350;color:#fff;font-family:var(--display);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#stage{position:fixed;inset:0;overflow:hidden;overflow:clip}
#wall{position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(circle at 20% 30%,#ffffff22 0 2px,transparent 3px) 0 0/90px 90px,
  radial-gradient(circle at 70% 60%,#ffffff18 0 2px,transparent 3px) 0 0/130px 130px,
  radial-gradient(ellipse 60% 50% at 50% 100%,#5b3c9e,transparent),linear-gradient(#2b2350,#3b2a6e)}
#floor{position:absolute;left:0;right:0;bottom:0;height:9%;background:#6d4c9e;border-top:6px solid #8a68c0;pointer-events:none}

#sofia{position:absolute;left:var(--sx);bottom:5%;height:var(--sh);aspect-ratio:800/1730;z-index:3;
  transform-origin:50% 100%;animation:bob 2.4s ease-in-out infinite}
#sofia svg{display:block;width:100%;height:100%;overflow:visible}
#sofia svg *{transform-box:view-box}
#sofia .ink{stroke:#1b1717;stroke-linecap:round;stroke-linejoin:round}
#sofia .skin{fill:#ffe3cf}
#sofia .hair{fill:#3b2a20}
#sofia .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
#sofia .mouth.open{opacity:0}
#sofia.talk .mouth.open{animation:flap .3s steps(1,end) infinite}
#sofia.talk .mouth.shut{animation:flap .3s steps(1,end) infinite -.15s}
#sofia .head{transform-origin:400px 870px}
#sofia .arm.l{transform-origin:262px 955px;animation:sway 2.4s ease-in-out infinite}
#sofia .arm.r{transform-origin:538px 955px;animation:sway 2.4s ease-in-out infinite reverse}
#sofia .leg.l{transform-origin:335px 1390px}
#sofia .leg.r{transform-origin:465px 1390px}
#sofia.walk{animation:stride .6s ease-in-out infinite}
#sofia.walk .leg.l{animation:stepL .6s ease-in-out infinite}
#sofia.walk .leg.r{animation:stepR .6s ease-in-out infinite}
#sofia.walk .arm.l{animation:swingL .6s ease-in-out infinite}
#sofia.walk .arm.r{animation:swingR .6s ease-in-out infinite}
#sofia.walk .head{animation:nod .6s ease-in-out infinite}
#sofia.talk .head{animation:chat .32s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes flap{0%{opacity:1}50%{opacity:0}}
@keyframes sway{50%{transform:rotate(4deg)}}
@keyframes stride{0%,50%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-3%) rotate(-2deg)}75%{transform:translateY(-3%) rotate(2deg)}}
@keyframes stepL{0%,50%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-60px) rotate(7deg)}}
@keyframes stepR{0%,50%,100%{transform:translateY(0) rotate(0)}75%{transform:translateY(-60px) rotate(-7deg)}}
@keyframes swingL{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(10deg)}}
@keyframes swingR{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(16deg)}}
@keyframes nod{0%,50%,100%{transform:rotate(0)}25%{transform:rotate(3deg)}75%{transform:rotate(-3deg)}}
@keyframes chat{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(3deg) scale(1.03)}}

#tabs{position:absolute;top:max(12px,env(safe-area-inset-top,0px));left:0;right:0;display:flex;justify-content:center;gap:14px;z-index:6}
.tab{width:min(17vw,96px);height:min(17vw,96px);border:0;border-radius:28px;background:#ffffff26;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:8px;transition:transform .1s}
.tab svg{width:100%;height:100%}
.tab.on{background:#fff;box-shadow:0 6px 0 #0004}
.tab:active{transform:scale(.94)}

#inst{position:absolute;left:calc(var(--sx) + var(--sw) + 2vw);right:2vw;top:calc(max(12px,env(safe-area-inset-top,0px)) + min(17vw,96px) + 18px);bottom:calc(9% + 96px);z-index:4;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
/* kitten piano and xylophone: eight keys, C to C */
.keys{display:flex;gap:1.2%;width:100%;flex:1 1 0;min-height:0;align-items:center;justify-content:center}
.key{position:relative;flex:1;max-width:120px;border:0;padding:0;cursor:pointer;touch-action:none}
.piano .key{height:100%;border-radius:22px 22px 28px 28px;background:linear-gradient(#fff 0 55%,var(--c) 55%);box-shadow:0 8px 0 #0005,inset 0 -10px 0 #0002}
.piano .key .kit{position:absolute;left:4%;right:4%;top:6%;aspect-ratio:1}
.piano .key .kit svg{width:100%;height:100%}
.piano .key .om{opacity:0}
.piano .key.hit .om{opacity:1}
.piano .key.hit{translate:0 6px;box-shadow:0 2px 0 #0005,inset 0 -10px 0 #0002}
.piano .key.hit .kit{animation:sing .35s ease-out}
@keyframes sing{40%{transform:scale(1.15) rotate(-6deg)}}
.xylo{position:relative}
.xylo::before,.xylo::after{content:"";position:absolute;left:2%;right:2%;height:14px;border-radius:7px;background:#a1693f;box-shadow:0 4px 0 #0004}
.xylo::before{top:30%}.xylo::after{bottom:30%}
.xylo .key{height:calc(100% - var(--i) * 5%);border-radius:16px;background:var(--c);box-shadow:0 8px 0 #0005,inset 0 -8px 0 #0002,inset 0 8px 0 #fff4;z-index:1}
.xylo .key::before,.xylo .key::after{content:"";position:absolute;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#e0e0e0;box-shadow:inset 0 -2px 0 #0003}
.xylo .key::before{top:8%}.xylo .key::after{bottom:8%}
.xylo .key.hit{translate:0 6px;box-shadow:0 2px 0 #0005,inset 0 -8px 0 #0002;filter:brightness(1.15)}
.key.next{outline:6px solid #fff;outline-offset:4px;animation:next .8s ease-in-out infinite}
@keyframes next{50%{outline-color:#ffd25a;scale:1.04}}
.key.next.hit{animation:none}
/* on the glowing key: how many times in a row; a long note is a tall pill that fills while she holds the key */
.cnt{position:absolute;left:50%;bottom:9%;translate:-50% 0;width:min(72%,60px);aspect-ratio:1;border-radius:999px;background:#fff;box-shadow:0 3px 0 #0003;
  overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--ink);font:900 clamp(17px,3.4vw,40px)/1 var(--display);z-index:2;pointer-events:none}
.cnt i{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--c);opacity:.55}
.cnt b{position:relative}
.key.holding .cnt i{height:100%;transition:height var(--hold) linear}
.cnt.pop{animation:pop .3s ease-out}
@keyframes pop{0%{scale:.5}60%{scale:1.25}}
.xylo .cnt{bottom:auto;top:50%;translate:-50% -50%}
.demo .key.next{outline:none;animation:none}
.demo .cnt{display:none}
/* the song strip above the keys: one dot per note of this line, a long note is a long dot */
.road{flex:none;--u:min(34px,6vw);display:flex;align-items:center;gap:calc(var(--u)*.3);max-width:100%;padding:6px 14px 6px 6px;border-radius:999px;background:#ffffff1f}
.listen{flex:none;width:52px;height:52px;border:0;border-radius:50%;background:#ffd25a;font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #0003}
.listen:active{translate:0 3px;box-shadow:0 1px 0 #0003}
.demo .listen{animation:pulse .6s ease-in-out infinite}
.line{display:flex;align-items:center;gap:calc(var(--u)*.3);padding-left:4px}
.line.in{animation:slide .45s ease-out}
@keyframes slide{from{translate:40px 0;opacity:0}}
.dot{position:relative;flex:none;width:calc(var(--d)*var(--u) + (var(--d) - 1)*var(--u)*.3);height:var(--u);border-radius:999px;background:var(--c);
  box-shadow:inset 0 -4px 0 #0003;overflow:hidden;transition:opacity .3s,scale .3s}
.dot i{position:absolute;left:0;top:0;bottom:0;width:0;background:#fff9}
.dot.done{opacity:.35;scale:.75}
.dot.now{outline:4px solid #fff;outline-offset:3px;animation:hop .8s ease-in-out infinite}
.dot.now.holding i{width:100%;transition:width var(--hold) linear}
.dot.play{outline:4px solid #fff;outline-offset:3px;scale:1.25}
.demo .dot.now{outline:none;animation:none}
@keyframes hop{50%{translate:0 -5px}}
.pips{display:flex;gap:5px;margin-left:8px}
.pips span{width:10px;height:10px;border-radius:50%;background:#ffffff40}
.pips span.done{background:#ffd25a}
/* drums */
.drums{display:grid;grid-template-columns:repeat(3,1fr);gap:3vmin;width:100%;height:100%;max-width:820px}
.pad{border:0;border-radius:32px;background:#ffffff1a;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:6%;touch-action:none}
.pad svg{width:100%;height:100%;max-height:100%}
.pad.hit{background:#ffffff40}
.pad.hit svg{animation:thump .25s ease-out}
@keyframes thump{40%{transform:scale(.9)}}

#songs{position:absolute;left:calc(var(--sx) + var(--sw) + 2vw);right:2vw;bottom:calc(9% + 12px);height:76px;display:flex;justify-content:center;gap:14px;z-index:6}
.song{width:76px;height:76px;border:0;border-radius:24px;background:#ffffff26;font-size:42px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.song.on{background:#ffd25a;box-shadow:0 0 0 5px #fff}
#beat{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(9% + 12px);width:76px;height:76px;border:0;border-radius:50%;background:#ffffff26;font-size:40px;cursor:pointer;z-index:6}
#beat.on{background:#66bb6a;animation:pulse .6s ease-in-out infinite}
@keyframes pulse{50%{scale:1.08}}
.note{position:absolute;z-index:8;pointer-events:none;font-size:40px;font-weight:900;translate:-50% -50%;animation:float 1.3s ease-out forwards;text-shadow:0 2px 0 #0004}
@keyframes float{from{transform:translate(0,0) scale(.6);opacity:1}to{transform:translate(var(--dx),-160px) scale(1.3);opacity:0}}

.corner{position:absolute;top:max(14px,env(safe-area-inset-top,0px));width:60px;height:60px;border-radius:50%;z-index:13;
  background:#ffffff33;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.corner svg{width:34px;height:34px}
.home{left:max(14px,env(safe-area-inset-left,0px))}
#overlay{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  background:#5b3c9ef2;color:#fff;text-align:center;padding:24px}
#overlay h1{margin:0;font-size:clamp(40px,7.5vw,80px);font-weight:900;line-height:1.05;text-shadow:0 4px 0 #0003}
#overlay .sub{margin:-8px 0 0;font-size:clamp(20px,3.4vw,28px);font-weight:900;opacity:.92}
.go{width:min(60vw,280px);padding:18px 12px 16px;border:0;border-radius:32px;background:var(--card);cursor:pointer;font-family:var(--display);
  box-shadow:0 8px 0 #0003;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink)}
.go .e{font-size:clamp(44px,7vw,64px);line-height:1.1;white-space:nowrap}
.go svg{width:52px;height:52px}

/* the big "yes!" at the end of a song */
.star{position:absolute;width:40px;height:40px;z-index:9;pointer-events:none;animation:fly 1.6s ease-out forwards}
@keyframes fly{from{transform:translate(0,0) scale(.3) rotate(0);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(240deg);opacity:0}}
.bigstar{position:absolute;width:min(42vmin,280px);height:min(42vmin,280px);translate:-50% -50%;z-index:9;pointer-events:none;animation:bigstar 1.1s ease-out forwards}
@keyframes bigstar{0%{scale:0;rotate:-60deg;opacity:1}40%{scale:1.15;rotate:8deg;opacity:1}100%{scale:1.6;rotate:0deg;opacity:0}}
.confetti{position:absolute;top:-5vh;width:13px;height:20px;border-radius:3px;z-index:9;pointer-events:none;animation:fall var(--t) cubic-bezier(.25,.6,.6,1) var(--dl) forwards}
@keyframes fall{to{transform:translate(var(--dx),112vh) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
/* tall screens: Sofia small at the bottom left, the instrument above */
@media (orientation:portrait){
  :root{--sh:min(26vh,300px)}
  #inst{left:3vw;right:3vw;bottom:calc(5% + var(--sh) + 10px)}
  #songs{left:calc(var(--sx) + var(--sw) + 3vw);right:3vw;bottom:calc(5% + var(--sh)*.3);height:76px}
  #beat{top:max(14px,env(safe-area-inset-top,0px));bottom:auto;width:60px;height:60px;font-size:32px}   /* top right, the songs need the bottom row */
}
@media (orientation:portrait) and (max-width:520px){.song{width:60px;height:60px;font-size:34px}#songs{gap:10px;height:60px}.tab{width:64px;height:64px}#inst{top:96px}
  .road{--u:5.2vw;padding-right:10px}.listen{width:44px;height:44px;font-size:24px}.pips{gap:4px;margin-left:4px}.pips span{width:7px;height:7px}}
@media (max-height:520px){:root{--sh:64vh}.tab{width:64px;height:64px}#inst{top:84px;bottom:calc(9% + 84px);gap:8px}.road{--u:24px;padding-block:4px}.listen{width:40px;height:40px;font-size:22px}.cnt{width:min(50%,40px);font-size:18px}#songs{height:64px}.song,#beat{width:64px;height:64px;font-size:34px}}
</style>
<style>/* no zooming by accident: no double-tap zoom on anything (own touch-action rules still win) */
*{touch-action:manipulation}</style>
<script>/* Safari on the iPad still zooms on a pinch, so stop the pinch gesture */
["gesturestart","gesturechange"].forEach(t => document.addEventListener(t, e => e.preventDefault(), {passive: false}));</script>
</head>

<script>
const $=id=>document.getElementById(id);
const stage=$("stage"), overlay=$("overlay"), sofia=$("sofia"), inst=$("inst");
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const NS="http://www.w3.org/2000/svg";

/* ---------- eight notes, C to C, each with its colour ---------- */
const FREQ=[261.63,293.66,329.63,349.23,392.00,440.00,493.88,523.25], SEMI=[0,2,4,5,7,9,11,12];
const COL=["#ef5350","#ffa726","#ffd740","#66bb6a","#26c6da","#42a5f5","#7e57c2","#ec407a"];
/* the kitten choir: the cartoon cat in eight coats; its mouth opens when it sings */
const LOOK=[
  {fur:"#f6a04d",line:"#a85a1c",stripe:"#d9782a",ear:"#ffc6cf",eye:"#3b2a20"},{fur:"#ffffff",line:"#a99cc0",ear:"#ffc6cf",eye:"#3a6fd8"},
  {fur:"#fff3c4",line:"#b59a5a",ear:"#ffc6cf",eye:"#3b8f5b"},{fur:"#a3adb8",line:"#5d6873",stripe:"#5d6873",ear:"#f4b6c2",eye:"#2f8f5b"},
  {fur:"#ffffff",line:"#8d6e63",patches:true,ear:"#ffc6cf",eye:"#6d4c41"},{fur:"#7f8fa6",line:"#3f4a5c",ear:"#e8b4c4",eye:"#f2c14e"},
  {fur:"#8d5a3b",line:"#4e2f1d",ear:"#e8a7b8",eye:"#f2c14e"},{fur:"#34303a",line:"#16131a",ear:"#d98b9b",eye:"#9ccc3d"},
];
function catSVG(L){const soft=L.line==="#16131a"?"#9a8fa6":L.line;
  const stripes=L.stripe?`<path d="M88 66q4 10 0 20M100 63v24M112 66q-4 10 0 20" fill="none" stroke="${L.stripe}" stroke-width="6" stroke-linecap="round" clip-path="url(#cathead)"/>`:"";
  const patches=L.patches?`<g clip-path="url(#cathead)"><path d="M40 60Q78 58 86 96Q70 118 40 112Z" fill="#f39a3d"/><path d="M118 60Q160 60 162 100Q140 96 122 84Z" fill="#3b3438"/></g>`:"";
  return `<svg viewBox="30 30 140 136" aria-hidden="true">
    <path d="M48 98L54 40Q58 34 64 38L92 70Z" fill="${L.patches?"#f39a3d":L.fur}" stroke="${L.line}" stroke-width="4" stroke-linejoin="round"/><path d="M58 76L61 50L80 70Z" fill="${L.ear}"/>
    <path d="M152 98L146 40Q142 34 136 38L108 70Z" fill="${L.patches?"#3b3438":L.fur}" stroke="${L.line}" stroke-width="4" stroke-linejoin="round"/><path d="M142 76L139 50L120 70Z" fill="${L.ear}"/>
    <ellipse cx="100" cy="110" rx="58" ry="50" fill="${L.fur}"/>${patches}${stripes}<ellipse cx="100" cy="110" rx="58" ry="50" fill="none" stroke="${L.line}" stroke-width="4"/>
    <ellipse cx="78" cy="106" rx="11" ry="13" fill="${L.eye}"/><ellipse cx="122" cy="106" rx="11" ry="13" fill="${L.eye}"/>
    <ellipse cx="78" cy="108" rx="5" ry="8" fill="#141414"/><ellipse cx="122" cy="108" rx="5" ry="8" fill="#141414"/>
    <circle cx="82" cy="100" r="4" fill="#fff"/><circle cx="126" cy="100" r="4" fill="#fff"/>
    <circle cx="66" cy="128" r="9" fill="#ff8fa8" opacity=".55"/><circle cx="134" cy="128" r="9" fill="#ff8fa8" opacity=".55"/>
    <path d="M94 122h12l-6 7z" fill="#ff7f9a" stroke="#ff7f9a" stroke-width="2" stroke-linejoin="round"/>
    <path d="M100 129q-4 9-12 6M100 129q4 9 12 6" fill="none" stroke="${soft}" stroke-width="3.5" stroke-linecap="round"/>
    <ellipse class="om" cx="100" cy="140" rx="10" ry="12" fill="#8e2a3a" stroke="${soft}" stroke-width="3"/>
    <path d="M60 118L28 112M60 126L28 130M140 118L172 112M140 126L172 130" stroke="${soft}" stroke-width="2.5" stroke-linecap="round" opacity=".7"/></svg>`}

/* ---------- sounds: the meow pitched to each note, a mallet for the xylophone, drums made from noise and tones ---------- */
let ctx=null, master=null, meow=null;
function ac(){ if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createDynamicsCompressor(); master.connect(ctx.destination)}
  if(ctx.state!=="running") ctx.resume(); return ctx }
async function loadMeow(){ if(meow) return; try{const ab=await (await fetch("audio/meow.mp3")).arrayBuffer(); meow=await new Promise((res,rej)=>ac().decodeAudioData(ab,res,rej))}catch(e){} }
function env(g,t,peak,decay){g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+.005); g.gain.exponentialRampToValueAtTime(.0001,t+decay)}
function osc(type,f,t,peak,decay,f1){const c=ac(),o=c.createOscillator(),g=c.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(f1) o.frequency.exponentialRampToValueAtTime(f1,t+decay);
  env(g,t,peak,decay); o.connect(g).connect(master); o.start(t); o.stop(t+decay+.05)}
let noiseBuf=null;
function noise(t,peak,decay,type,freq,q=1){const c=ac(); if(!noiseBuf){noiseBuf=c.createBuffer(1,c.sampleRate*2,c.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1}
  const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain(); s.buffer=noiseBuf; f.type=type; f.frequency.value=freq; f.Q.value=q; env(g,t,peak,decay);
  s.connect(f).connect(g).connect(master); s.start(t); s.stop(t+decay+.05)}
/* with hold, the note goes on until the returned stop() — the kitten hums after its meow, the xylophone rolls */
function piano(i,t,hold){const c=ac(); t=t||c.currentTime;
  if(meow){const s=c.createBufferSource(),g=c.createGain(); s.buffer=meow; s.playbackRate.value=.85*Math.pow(2,SEMI[i]/12); g.gain.value=.9; s.connect(g).connect(master); s.start(t)}
  else osc("triangle",FREQ[i],t,.4,.6)
  if(!hold) return ()=>{};
  const o=c.createOscillator(),v=c.createOscillator(),vg=c.createGain(),f=c.createBiquadFilter(),g=c.createGain();
  o.type="triangle"; o.frequency.value=FREQ[i]; v.frequency.value=5.5; vg.gain.value=FREQ[i]*.012; v.connect(vg).connect(o.frequency);
  f.type="lowpass"; f.frequency.value=FREQ[i]*3; g.gain.setValueAtTime(0,t); g.gain.setValueAtTime(0,t+.3); g.gain.linearRampToValueAtTime(.16,t+.55);
  o.connect(f).connect(g).connect(master); o.start(t); v.start(t);
  return ()=>{const n=c.currentTime; g.gain.cancelScheduledValues(n); g.gain.setValueAtTime(g.gain.value,n); g.gain.linearRampToValueAtTime(0,n+.15); o.stop(n+.2); v.stop(n+.2)}}
function xylo(i,t,hold){t=t||ac().currentTime; const f=FREQ[i]*2, hit=(t,v)=>{osc("sine",f,t,.5*v,1.4); osc("sine",f*3.98,t,.12*v,.25); osc("sine",f*9.2,t,.04*v,.08); noise(t,.15*v,.03,"highpass",4000)};
  hit(t,1); if(!hold) return ()=>{};
  let roll=null; const wait=setTimeout(()=>roll=setInterval(()=>hit(ac().currentTime,.45),95),250);
  return ()=>{clearTimeout(wait); clearInterval(roll)}}
const DRUMS={
  kick(t){osc("sine",160,t,1,.45,42); noise(t,.2,.02,"lowpass",900)},
  snare(t){noise(t,.7,.22,"highpass",1500); osc("triangle",190,t,.4,.12,150)},
  bongo(t){osc("sine",260,t,.8,.3,190); osc("sine",520,t,.15,.08)},
  cymbal(t){noise(t,.35,1.6,"highpass",6500); noise(t,.25,.4,"bandpass",9000,2)},
  maracas(t){noise(t,.45,.07,"highpass",5000); noise(t+.11,.4,.07,"highpass",5000)},
  bell(t){[1,2.76,5.4].forEach((m,k)=>osc("sine",880*m,t,[.35,.12,.06][k],1.1-k*.3))},
};

/* drawings for the drum pads */
const PAD={
  kick:`<svg viewBox="0 0 120 110"><ellipse cx="60" cy="88" rx="50" ry="14" fill="#8e1f1f"/><path d="M10 34v54a50 14 0 0 0 100 0V34" fill="#e53935"/><path d="M10 50l25 34 25-34 25 34 25-34" fill="none" stroke="#ffd25a" stroke-width="5"/><ellipse cx="60" cy="34" rx="50" ry="14" fill="#fff3e0" stroke="#bdbdbd" stroke-width="4"/></svg>`,
  snare:`<svg viewBox="0 0 120 110"><path d="M98 6L70 40M22 6L50 40" stroke="#a1693f" stroke-width="7" stroke-linecap="round"/><path d="M20 50v34a40 12 0 0 0 80 0V50" fill="#1e88e5"/><path d="M20 62h80M20 74h80" stroke="#90caf9" stroke-width="4"/><ellipse cx="60" cy="50" rx="40" ry="12" fill="#fff" stroke="#bdbdbd" stroke-width="4"/></svg>`,
  bongo:`<svg viewBox="0 0 120 110"><path d="M18 30l8 70h28l8-70z" fill="#a1693f"/><path d="M62 40l7 60h26l7-60z" fill="#8d5a3b"/><ellipse cx="40" cy="30" rx="22" ry="8" fill="#f5e6c8" stroke="#6d4c41" stroke-width="3"/><ellipse cx="82" cy="40" rx="20" ry="7" fill="#f5e6c8" stroke="#6d4c41" stroke-width="3"/><path d="M22 60h36M66 66h32" stroke="#ffd25a" stroke-width="4"/></svg>`,
  cymbal:`<svg viewBox="0 0 120 110"><path d="M60 40V104M40 104h40" stroke="#757575" stroke-width="6" stroke-linecap="round"/><ellipse cx="60" cy="40" rx="52" ry="12" fill="#ffca28" stroke="#c79100" stroke-width="4"/><ellipse cx="60" cy="36" rx="8" ry="4" fill="#c79100"/><path d="M24 38q36 -8 72 0" stroke="#fff8" stroke-width="3" fill="none"/></svg>`,
  maracas:`<svg viewBox="0 0 120 110"><g transform="rotate(-20 40 60)"><ellipse cx="40" cy="38" rx="20" ry="26" fill="#ec407a"/><path d="M40 64v40" stroke="#a1693f" stroke-width="9" stroke-linecap="round"/><path d="M26 30h28M24 42h32" stroke="#ffd25a" stroke-width="4"/></g><g transform="rotate(20 82 60)"><ellipse cx="82" cy="38" rx="20" ry="26" fill="#66bb6a"/><path d="M82 64v40" stroke="#a1693f" stroke-width="9" stroke-linecap="round"/><path d="M68 30h28M66 42h32" stroke="#fff" stroke-width="4"/></g></svg>`,
  bell:`<svg viewBox="0 0 120 110"><path d="M60 10v8" stroke="#c79100" stroke-width="6" stroke-linecap="round"/><path d="M60 18c-22 0-30 18-30 40 0 14-8 22-14 28h88c-6-6-14-14-14-28 0-22-8-40-30-40z" fill="#ffca28" stroke="#c79100" stroke-width="4" stroke-linejoin="round"/><circle cx="60" cy="94" r="9" fill="#c79100"/><path d="M42 40q6-10 14-12" stroke="#fff9" stroke-width="5" stroke-linecap="round" fill="none"/></svg>`,
};

/* ---------- songs to play along: the next key glows with how many times in a row it comes; her tap on it plays the note and moves on.
   A strip above the keys shows the line she is on (long notes are long dots), and 👂 plays that line first.
   Tunes are written line by line ("|"); C D E F G A B c are the eight keys, a number after a note is how many beats it lasts ---------- */
const SONGS={
  twinkle:{icon:"⭐",tune:"C C G G A A G2 | F F E E D D C2 | G G F F E E D2 | G G F F E E D2 | C C G G A A G2 | F F E E D D C2"},
  lamb:{icon:"🐑",tune:"E D C D E E E2 | D D D2 E G G2 | E D C D E E E E | D D E D C4"},
  bells:{icon:"🔔",tune:"E E E2 E E E2 | E G C D E4 | F F F F F E E E | E D D E D2 G2"},
};
for(const S of Object.values(SONGS)){S.notes=[]; S.dur=[]; S.lines=[0];
  for(const line of S.tune.split("|")){for(const w of line.trim().split(/\s+/)){S.notes.push("CDEFGABc".indexOf(w[0])); S.dur.push(+w.slice(1)||1)} S.lines.push(S.notes.length)}}
const BEAT=.6;   // seconds, the same as the backing beat
let mode=store.get("band-mode")||"piano", song=null, pos=0;

/* ---------- drawing the instruments ---------- */
const TABS={piano:catSVG(LOOK[0]),
  xylo:`<svg viewBox="0 0 100 100">${COL.map((c,i)=>`<rect x="${6+i*11.4}" y="${14+i*3}" width="9" height="${72-i*6}" rx="3" fill="${c}"/>`).join("")}</svg>`,
  drums:PAD.kick};
function drawTabs(){$("tabs").innerHTML=Object.keys(TABS).map(m=>`<button class="tab${m===mode?" on":""}" data-m="${m}" aria-label="${m}">${TABS[m]}</button>`).join("");
  $("tabs").querySelectorAll(".tab").forEach(b=>b.onclick=()=>{ac(); setMode(b.dataset.m)})}
function setMode(m){mode=m; store.set("band-mode",m); song=null; drawTabs(); draw()}
function draw(){
  stopDemo();
  if(mode==="drums"){
    inst.innerHTML=`<div class="drums">${Object.keys(PAD).map(d=>`<button class="pad" data-d="${d}" aria-label="${d}">${PAD[d]}</button>`).join("")}</div>`;
    $("songs").innerHTML="";
  }else{
    inst.innerHTML=(song?`<div class="road"><button class="listen" aria-label="Listen">👂</button><div class="line"></div><div class="pips"></div></div>`:"")+
      `<div class="keys ${mode}">${FREQ.map((f,i)=>`<button class="key" data-i="${i}" style="--c:${COL[i]};--i:${i}" aria-label="note ${i+1}">${mode==="piano"?`<span class="kit">${catSVG(LOOK[i])}</span>`:""}</button>`).join("")}</div>`;
    $("songs").innerHTML=Object.keys(SONGS).map(s=>`<button class="song${s===song?" on":""}" data-s="${s}" aria-label="${s}">${SONGS[s].icon}</button>`).join("");
    $("songs").querySelectorAll(".song").forEach(b=>b.onclick=()=>{ac(); startSong(b.dataset.s)});
    const l=inst.querySelector(".listen"); if(l) l.onclick=()=>{ac(); demo()};
    markNext();
  }
}
const lineOf=n=>{const L=SONGS[song].lines; let j=0; while(L[j+1]<=n) j++; return j};
let shownLine=-1;
function drawRoad(){const S=SONGS[song], j=lineOf(pos), line=inst.querySelector(".line"); if(!line) return;
  line.innerHTML=S.notes.slice(S.lines[j],S.lines[j+1]).map((i,k)=>{const n=S.lines[j]+k;
    return `<span class="dot${n<pos?" done":n===pos?" now":""}" data-n="${n}" style="--c:${COL[i]};--d:${S.dur[n]};--hold:${(S.dur[n]*BEAT).toFixed(2)}s"><i></i></span>`}).join("");
  if(j!==shownLine){line.classList.remove("in"); void line.offsetWidth; line.classList.add("in"); shownLine=j}
  inst.querySelector(".pips").innerHTML=S.lines.slice(1).map((_,k)=>`<span${k<j?' class="done"':""}></span>`).join("")}
function markNext(){inst.querySelectorAll(".key").forEach(k=>{k.classList.remove("next","holding"); k.querySelector(".cnt")?.remove()});
  if(!song) return;
  const S=SONGS[song], i=S.notes[pos], k=inst.querySelector(`.key[data-i="${i}"]`); let times=1; while(S.notes[pos+times]===i) times++;
  const d=S.dur[pos]; k.classList.add("next"); k.style.setProperty("--hold",(d*BEAT).toFixed(2)+"s");
  k.insertAdjacentHTML("beforeend",`<span class="cnt pop" style="aspect-ratio:1/${(.6+.4*d).toFixed(2)}"><i></i><b>${times}</b></span>`);
  drawRoad()}
function startSong(s){
  if(song===s){song=null; draw(); return}   // a second tap stops it
  song=s; pos=0; shownLine=-1; draw(); setTimeout(()=>{if(song===s&&pos===0) demo()},500);   // hear the first line before playing it
}

/* ---------- 👂: the kittens play the line she is on, in time, lighting up the keys and the dots ---------- */
let demoTok=0, demoStop=null;
function stopDemo(){demoTok++; demoStop?.(); demoStop=null; inst.classList.remove("demo");
  inst.querySelectorAll(".dot.play").forEach(d=>d.classList.remove("play")); inst.querySelectorAll(".key.hit").forEach(k=>{if(![...held.values()].some(h=>h.k===k)) k.classList.remove("hit")})}
async function demo(){
  stopDemo(); if(!song) return; const tok=demoTok, S=SONGS[song], j=lineOf(pos); inst.classList.add("demo");
  for(let n=S.lines[j]; n<S.lines[j+1]; n++){
    const i=S.notes[n], k=inst.querySelector(`.key[data-i="${i}"]`), dot=inst.querySelector(`.dot[data-n="${n}"]`), ms=S.dur[n]*BEAT*1000;
    demoStop=(mode==="piano"?piano:xylo)(i,0,S.dur[n]>1); k.classList.add("hit"); dot?.classList.add("play"); floatNote(k,COL[i]); dance();
    await wait(ms*.85); if(tok!==demoTok) return;
    demoStop(); demoStop=null; k.classList.remove("hit"); dot?.classList.remove("play");
    await wait(ms*.15); if(tok!==demoTok) return;
  }
  inst.classList.remove("demo");
}

/* ---------- playing: pointerdown, so it answers at once and two fingers play two notes ---------- */
function flash(el){el.classList.remove("hit"); void el.offsetWidth; el.classList.add("hit"); setTimeout(()=>el.classList.remove("hit"),220)}
function floatNote(el,color,text){const r=el.getBoundingClientRect(), n=document.createElement("div"); n.className="note"; n.textContent=text||(Math.random()<.5?"♪":"♫");
  n.style.cssText=`left:${r.left+r.width/2}px;top:${r.top+r.height*.25}px;color:${color}`; n.style.setProperty("--dx",(Math.random()*80-40)+"px"); stage.appendChild(n); setTimeout(()=>n.remove(),1400)}
let danceT=null;
function dance(){sofia.classList.add("talk"); clearTimeout(danceT); danceT=setTimeout(()=>sofia.classList.remove("talk"),300);
  sofia.animate([{translate:"0 0",rotate:"0deg"},{translate:"0 -4%",rotate:(Math.random()<.5?-4:4)+"deg"},{translate:"0 0",rotate:"0deg"}],{duration:320,easing:"ease-out"})}
/* a key sounds as long as it is held; in a song the note counts when she lets go, or once she has held it its full length */
const held=new Map();   // pointerId -> {k, stop, n: the song note this press plays, or null}
inst.addEventListener("pointerdown",e=>{
  ac(); const k=e.target.closest(".key"), p=e.target.closest(".pad"); if(!k&&!p) return; e.preventDefault();
  if(inst.classList.contains("demo")) stopDemo();
  if(p){DRUMS[p.dataset.d](ac().currentTime); flash(p); dance(); return}
  const i=+k.dataset.i, h={k,stop:(mode==="piano"?piano:xylo)(i,0,true),n:null};
  k.classList.remove("hit"); void k.offsetWidth; k.classList.add("hit"); floatNote(k,COL[i]); dance();
  if(song&&i===SONGS[song].notes[pos]&&![...held.values()].some(o=>o.n===pos)){
    const d=SONGS[song].dur[pos]; h.n=pos; k.classList.add("holding"); inst.querySelector(`.dot[data-n="${pos}"]`)?.classList.add("holding");
    h.timer=setTimeout(()=>{if(d>1) floatNote(k,"#ffd25a","★"); played(h)},d*BEAT*1000)}
  held.set(e.pointerId,h);
});
function letGo(e){const h=held.get(e.pointerId); if(!h) return; held.delete(e.pointerId); h.stop();
  if(![...held.values()].some(o=>o.k===h.k)) h.k.classList.remove("hit"); played(h)}
addEventListener("pointerup",letGo); addEventListener("pointercancel",letGo);
function played(h){if(h.n===null) return; const n=h.n; h.n=null; clearTimeout(h.timer); h.k.classList.remove("holding");
  if(!song||pos!==n) return;
  if(++pos>=SONGS[song].notes.length) songDone();
  else{if(SONGS[song].lines.includes(pos)) setTimeout(dance,150); markNext()}}
async function songDone(){
  const s=song; song=null; draw();
  celebrate("50%","40%"); const c=ac(), t=c.currentTime; [0,2,4,7].forEach((n,k)=>(mode==="piano"?piano:xylo)(n,t+k*.15));
  for(let k=0;k<4;k++){setTimeout(dance,k*350)}
}

/* ---------- a backing beat: big drum and shaker, 100 beats a minute, scheduled ahead on the audio clock ---------- */
let beatOn=false, nextT=0, step=0, timer=null;
function tick(){const c=ac(); while(nextT<c.currentTime+.2){ if(step%4===0) DRUMS.kick(nextT); if(step%4===2) noise(nextT,.25,.06,"highpass",6000);
  if(step%8===4) noise(nextT,.35,.12,"highpass",2000); nextT+=.15; step++ }}
$("beat").onclick=()=>{const c=ac(); beatOn=!beatOn; $("beat").classList.toggle("on",beatOn);
  if(beatOn){nextT=c.currentTime+.05; step=0; timer=setInterval(tick,50)} else clearInterval(timer)};

/* ---------- start screen (a tap is needed before the sound can start) ---------- */
function startScreen(){
  overlay.hidden=false;
  overlay.innerHTML=`<h1>Animal band</h1><p class="sub">Оркестр · Orķestris</p>
    <button class="go" id="go"><span class="e">🐱🎹🥁</span><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="var(--pink)"/><path d="M15 11l14 9-14 9z" fill="#fff"/></svg></button>`;
  $("go").onclick=async()=>{ac(); overlay.hidden=true; await loadMeow(); [0,2,4,7].forEach((n,k)=>piano(n,ac().currentTime+.1+k*.18))};
}

/* the big "yes!" */
function celebrate(x,y){
  const st=stage, STAR='M12 2l3 7 7 .6-5.4 4.7 1.7 7.2L12 17.8 5.7 21.5l1.7-7.2L2 9.6 9 9z';
  const big=document.createElementNS(NS,"svg"); big.setAttribute("viewBox","0 0 24 24"); big.classList.add("bigstar");
  big.innerHTML=`<path d="${STAR}" fill="#ffd25a" stroke="#f5a623" stroke-width="1.2" stroke-linejoin="round"/><circle cx="9.6" cy="11" r=".9" fill="#5a3a12"/><circle cx="14.4" cy="11" r=".9" fill="#5a3a12"/><path d="M9.8 13.6q2.2 1.8 4.4 0" fill="none" stroke="#5a3a12" stroke-width=".8" stroke-linecap="round"/>`;
  big.style.left=x; big.style.top=y; st.appendChild(big); setTimeout(()=>big.remove(),1200);
  const C=["#ffd25a","#f06292","#fff","#5fbf7f","#6ec6ff","#ff8a50","#b388ff"];
  for(let i=0;i<40;i++){const s=document.createElementNS(NS,"svg"), z=22+Math.random()*44; s.setAttribute("viewBox","0 0 24 24"); s.classList.add("star");
    s.innerHTML=`<path d="${STAR}" fill="${C[i%C.length]}" stroke="#0002" stroke-width=".6"/>`;
    s.style.cssText=`left:${x};top:${y};width:${z}px;height:${z}px;margin:${-z/2}px 0 0 ${-z/2}px;animation-duration:${(1.5+Math.random()*.9).toFixed(2)}s`;
    s.style.setProperty("--dx",(Math.random()*90-45)+"vw"); s.style.setProperty("--dy",(Math.random()*90-45)+"vh");
    st.appendChild(s); setTimeout(()=>s.remove(),2600)}
  for(let i=0;i<34;i++){const c=document.createElement("div"); c.className="confetti";
    c.style.cssText=`left:${Math.random()*100}%;background:${C[(i+2)%C.length]};--dx:${(Math.random()*24-12).toFixed(1)}vw;--r:${Math.round(Math.random()*900-450)}deg;--t:${(2+Math.random()*1.2).toFixed(2)}s;--dl:${(Math.random()*.5).toFixed(2)}s`;
    if(i%3===0){c.style.borderRadius="50%"; c.style.height="13px"}
    st.appendChild(c); setTimeout(()=>c.remove(),3900)}
}
drawTabs(); draw(); startScreen();
</script>
</body>
