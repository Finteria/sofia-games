<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Veggie power! · Сила овощей! · Dārzeņu spēks!</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap">
<style>
/* layout: Sofia sits behind the table; her plate of vegetables in front of her, a bowl of soup next to it, the power bar at the top.
   She feeds Sofia: drag (or tap) a vegetable to her mouth, crunch, and every vegetable eaten gives Sofia a power. */
:root{
  --ink:#24352b; --card:#fffdf6; --pink:#f06292;
  --display:"Nunito","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
  --th:36vh; --sh:min(88vh,900px); --sx:38%; --px:38%; --bx:74%; --pw:min(46vh,36vw); --bw:min(34vh,26vw);
}
@media (orientation:portrait){:root{--th:32vh; --sh:min(66vh,98vw,900px); --sx:50%; --px:32%; --bx:75%; --pw:min(30vh,50vw); --bw:min(24vh,38vw)}}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:#e3f4ff;color:var(--ink);font-family:var(--display);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#stage{position:fixed;inset:0;overflow:hidden;overflow:clip}
#wall{position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(#fff6 2px,transparent 2px) 0 0/56px 56px,linear-gradient(90deg,#fff6 2px,transparent 2px) 0 0/56px 56px,#cdeafc}
#sky{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .8s;background:linear-gradient(#7fc8ff,#d9f1ff)}
#sky.on{opacity:1}
.cloud{position:absolute;width:30vw;height:12vw;max-width:340px;max-height:130px;border-radius:999px;background:#fff;opacity:.95;filter:drop-shadow(0 8px 0 #0001)}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:45%;height:120%;left:15%;top:-50%}.cloud::after{width:35%;height:95%;left:48%;top:-35%}

/* Sofia behind the table */
#sofia{position:absolute;left:var(--sx);bottom:calc(var(--th) - var(--sh) * .42);height:var(--sh);aspect-ratio:800/1730;translate:-50% 0;z-index:2;
  transform-origin:50% 100%;animation:bob 2.4s ease-in-out infinite}
#sofia svg{display:block;width:100%;height:100%;overflow:visible}
#sofia svg *{transform-box:view-box}
#sofia .ink{stroke:#1b1717;stroke-linecap:round;stroke-linejoin:round}
#sofia .skin{fill:#ffe3cf}
#sofia .hair{fill:#3b2a20}
#sofia .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
#sofia .mouth.open{opacity:0}
#sofia.talk .mouth.open{animation:flap .3s steps(1,end) infinite}
#sofia.talk .mouth.shut{animation:flap .3s steps(1,end) infinite -.15s}
#sofia .head{transform-origin:400px 870px}
#sofia .arm.l{transform-origin:262px 955px;animation:sway 2.4s ease-in-out infinite}
#sofia .arm.r{transform-origin:538px 955px;animation:sway 2.4s ease-in-out infinite reverse}
#sofia .leg.l{transform-origin:335px 1390px}
#sofia .leg.r{transform-origin:465px 1390px}
#sofia.walk{animation:stride .6s ease-in-out infinite}
#sofia.walk .leg.l{animation:stepL .6s ease-in-out infinite}
#sofia.walk .leg.r{animation:stepR .6s ease-in-out infinite}
#sofia.walk .arm.l{animation:swingL .6s ease-in-out infinite}
#sofia.walk .arm.r{animation:swingR .6s ease-in-out infinite}
#sofia.walk .head{animation:nod .6s ease-in-out infinite}
#sofia.talk .head{animation:chat .32s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes flap{0%{opacity:1}50%{opacity:0}}
@keyframes sway{50%{transform:rotate(4deg)}}
@keyframes stride{0%,50%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-3%) rotate(-2deg)}75%{transform:translateY(-3%) rotate(2deg)}}
@keyframes stepL{0%,50%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-60px) rotate(7deg)}}
@keyframes stepR{0%,50%,100%{transform:translateY(0) rotate(0)}75%{transform:translateY(-60px) rotate(-7deg)}}
@keyframes swingL{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(10deg)}}
@keyframes swingR{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(16deg)}}
@keyframes nod{0%,50%,100%{transform:rotate(0)}25%{transform:rotate(3deg)}75%{transform:rotate(-3deg)}}
@keyframes chat{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(3deg) scale(1.03)}}
#sofia svg .cape{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);transition:transform .6s cubic-bezier(.3,1.6,.5,1)}
#sofia.super svg .cape{transform:scaleY(1)}
#sofia svg .shades{opacity:0;transition:opacity .3s}
#sofia.cool svg .shades{opacity:1}
#sofia.flying{animation:none}

#table{position:absolute;left:0;right:0;bottom:0;height:var(--th);z-index:3;transition:translate .8s ease-in;
  background:repeating-conic-gradient(#ef9a9a 0 25%,#fff 0 50%) 0 0/56px 56px;box-shadow:inset 0 12px 0 #e57373}
#table.away,#plate.away,#bowl.away,#spoon.away{translate:0 60vh}

/* the plate and its vegetables */
#plate{position:absolute;z-index:4;left:var(--px);bottom:calc(var(--th) * .38);width:var(--pw);aspect-ratio:2.2;translate:-50% 0;transition:translate .8s ease-in}
#plate>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.veg{position:absolute;bottom:34%;width:30%;text-align:center;font-size:calc(var(--pw) * .2);line-height:1;cursor:pointer;touch-action:none;
  filter:drop-shadow(0 4px 2px #0003);transition:scale .2s}
.veg span{display:inline-block}
.b1 span{-webkit-mask:radial-gradient(circle at 92% 14%,#0000 24%,#000 25%);mask:radial-gradient(circle at 92% 14%,#0000 24%,#000 25%)}
.b2 span{-webkit-mask:radial-gradient(circle at 92% 14%,#0000 24%,#000 25%),radial-gradient(circle at 96% 58%,#0000 22%,#000 23%);
  -webkit-mask-composite:source-in;mask:radial-gradient(circle at 92% 14%,#0000 24%,#000 25%),radial-gradient(circle at 96% 58%,#0000 22%,#000 23%);mask-composite:intersect}
.veg.lift{visibility:hidden}
.veg.wiggle{animation:wiggle .7s ease-in-out}
.veg.help{animation:pulse 1s ease-in-out infinite;filter:drop-shadow(0 0 12px #ffd25a) drop-shadow(0 0 4px #ffd25a)}
@keyframes wiggle{20%{rotate:-12deg}40%{rotate:12deg}60%{rotate:-8deg}80%{rotate:6deg}}
@keyframes pulse{50%{scale:1.15}}
.ghost{position:fixed;z-index:12;pointer-events:none;translate:-50% -50%;line-height:1;filter:drop-shadow(0 6px 4px #0003)}

/* the soup bowl: the soup gets lower and clearer, and a picture shows at the bottom */
#bowl{position:absolute;z-index:4;left:var(--bx);bottom:calc(var(--th) * .3);width:var(--bw);aspect-ratio:1.4;translate:-50% 0;cursor:pointer;transition:translate .8s ease-in}
#bowl>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#bowl .pic{position:absolute;left:50%;top:27%;translate:-50% -50%;font-size:calc(var(--bw) * .22);line-height:1;opacity:.9}
#bowl .soup{position:absolute;left:50%;top:27%;width:84%;height:44%;translate:-50% -50%;border-radius:50%;
  background:radial-gradient(circle at 35% 40%,#ffcc80,#fb8c00 70%);transition:scale .6s,opacity .6s}
#bowl .soup::before,#bowl .soup::after{content:"";position:absolute;border-radius:50%;background:#7cb342}
#bowl .soup::before{width:12%;height:20%;left:28%;top:40%}#bowl .soup::after{width:10%;height:18%;left:60%;top:30%;background:#ff7043}
#bowl.help{filter:drop-shadow(0 0 16px #ffd25a)}
#spoon{position:absolute;z-index:5;width:calc(var(--bw) * .5);aspect-ratio:2.5;translate:-18% -50%;rotate:-18deg;transform-origin:18% 50%;pointer-events:none;transition:translate .8s ease-in}
#spoon svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 3px 2px #0003)}
#spoon.full .dollop{opacity:1}
.steam{position:absolute;z-index:6;width:calc(var(--bw) * .22);height:calc(var(--bw) * .5);translate:-50% -100%;cursor:pointer;animation:steam 2.2s ease-in-out infinite}
.steam svg{width:100%;height:100%;overflow:visible}
.steam.help svg path{stroke:#ffd25a}
@keyframes steam{50%{transform:translateY(-10%) scaleX(-1)}}

/* the power bar */
#power{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:50%;translate:-50% 0;z-index:5;display:flex;gap:10px;padding:8px 14px;border-radius:999px;
  background:#ffffffaa;pointer-events:none}
.slot{width:48px;height:48px;border-radius:50%;background:#fff;border:4px dashed #b0bec5;display:flex;align-items:center;justify-content:center;font-size:28px;filter:grayscale(1);opacity:.55;transition:all .4s}
.slot.done{border:4px solid #ffb300;filter:none;opacity:1;background:#fff8e1;box-shadow:0 0 16px #ffd25a;transform:scale(1.12)}
.bolt{font-size:34px;align-self:center}
@media (max-width:500px){.slot{width:38px;height:38px;font-size:22px}#power{gap:6px;padding:6px 10px}.bolt{font-size:26px}}
/* a phone on its side: the bar goes to the right, so it doesn't cover Sofia's head; a bigger plate */
@media (max-height:520px) and (orientation:landscape){#power{left:auto;right:max(12px,env(safe-area-inset-right,0px));translate:none}.slot{width:38px;height:38px;font-size:22px}#power{gap:6px;padding:6px 10px}.bolt{font-size:26px}:root{--pw:min(60vh,38vw)}}

.fx{position:absolute;z-index:8;pointer-events:none;translate:-50% -50%;font-size:46px;animation:rise 1.6s ease-out forwards}
@keyframes rise{from{transform:translate(0,0) scale(.5);opacity:0}15%{opacity:1}to{transform:translate(var(--dx),-160px) scale(1.2);opacity:0}}
.crumb{position:absolute;z-index:8;pointer-events:none;width:9px;height:9px;border-radius:3px;animation:crumb .8s ease-in forwards}
@keyframes crumb{to{transform:translate(var(--dx),var(--dy)) rotate(200deg);opacity:0}}
#farstar{position:absolute;z-index:1;font-size:min(7vh,48px);pointer-events:none;animation:twinkle .8s ease-in-out infinite alternate}
@keyframes twinkle{to{scale:1.4;rotate:20deg}}

.corner{position:absolute;top:max(14px,env(safe-area-inset-top,0px));width:60px;height:60px;border-radius:50%;z-index:13;
  background:#ffffff55;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.corner svg{width:34px;height:34px}
.home{left:max(14px,env(safe-area-inset-left,0px))}
#stage>.home{background:#5b9bd599}

#overlay{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  background:#43a047f0;color:#fff;text-align:center;padding:24px;overflow-y:auto}
#overlay>h1{margin-top:auto!important}
#overlay>:last-child{margin-bottom:auto}
#overlay h1{margin:0;font-size:clamp(40px,7.5vw,80px);font-weight:900;line-height:1.05;text-shadow:0 4px 0 #0003}
#overlay .sub{margin:-8px 0 0;font-size:clamp(20px,3.4vw,28px);font-weight:900;opacity:.92}
.langs{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.go{width:min(40vw,220px);padding:16px 10px 14px;border:0;border-radius:32px;background:var(--card);cursor:pointer;font-family:var(--display);
  box-shadow:0 8px 0 #0003;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);transition:transform .1s}
.go:active{transform:translateY(6px);box-shadow:0 2px 0 #0003}
.go .e{font-size:clamp(44px,7vw,64px);line-height:1.1;white-space:nowrap}
.go .name{font-size:clamp(20px,3vw,26px);font-weight:900}
.go svg{width:48px;height:48px}
.go.last{outline:5px solid #ffd25a;outline-offset:3px}
.pill{border:0;border-radius:999px;padding:12px 26px;font:900 clamp(18px,2.6vw,24px) var(--display);background:#ffffff33;color:#fff;cursor:pointer;min-height:56px}
.stickers{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:760px}
.sticker{width:84px;height:84px;border-radius:22px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:52px;border:0;cursor:pointer}
/* the real-life chart */
.eat{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:520px;width:100%}
.eat button{aspect-ratio:1;border:0;border-radius:24px;background:var(--card);font-size:clamp(40px,7vh,60px);cursor:pointer;box-shadow:0 6px 0 #0003;position:relative}
.eat button:active{transform:translateY(4px);box-shadow:0 2px 0 #0003}
.eat button.got::after{content:"✓";position:absolute;right:6px;top:2px;font-size:24px;color:#2e7d32;font-weight:900}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:640px;width:100%}
.day{background:#ffffff33;border-radius:16px;padding:6px 2px;min-height:86px;display:flex;flex-direction:column;align-items:center;gap:2px}
.day b{font-size:16px}
.day.today{background:#fff;color:var(--ink);outline:4px solid #ffd25a}
.day .st{display:flex;flex-wrap:wrap;justify-content:center;font-size:20px;line-height:1.1}
@media (max-height:520px){.go{padding:10px 8px}.go .e{font-size:40px}.go svg{width:38px;height:38px}#overlay{gap:10px}.sticker{width:64px;height:64px;font-size:40px}
  .eat{grid-template-columns:repeat(8,1fr);max-width:760px}.eat button{font-size:34px;border-radius:16px}.day{min-height:56px}}

/* the big "yes!" */
.star{position:absolute;width:40px;height:40px;z-index:9;pointer-events:none;animation:fly 1.6s ease-out forwards}
@keyframes fly{from{transform:translate(0,0) scale(.3) rotate(0);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(240deg);opacity:0}}
.bigstar{position:absolute;width:min(42vmin,280px);height:min(42vmin,280px);translate:-50% -50%;z-index:9;pointer-events:none;animation:bigstar 1.1s ease-out forwards}
@keyframes bigstar{0%{scale:0;rotate:-60deg;opacity:1}40%{scale:1.15;rotate:8deg;opacity:1}100%{scale:1.6;rotate:0deg;opacity:0}}
.confetti{position:absolute;top:-5vh;width:13px;height:20px;border-radius:3px;z-index:9;pointer-events:none;animation:fall var(--t) cubic-bezier(.25,.6,.6,1) var(--dl) forwards}
@keyframes fall{to{transform:translate(var(--dx),112vh) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
<style>/* no zooming by accident: no double-tap zoom on anything (own touch-action rules still win) */
*{touch-action:manipulation}</style>
<script>/* Safari on the iPad still zooms on a pinch, so stop the pinch gesture */
["gesturestart","gesturechange"].forEach(t => document.addEventListener(t, e => e.preventDefault(), {passive: false}));</script>
</head>

  <div id="sofia" role="img" aria-label="Sofia: tap to hear it again">
    <svg viewBox="0 0 800 1730" aria-hidden="true">
      <defs>

        <path class="skin ink" d="M158 540 C158 360 270 280 400 280 C530 280 642 360 642 540 C642 700 610 795 530 842 C475 872 325 872 270 842 C190 795 158 700 158 540Z" stroke-width="9"/>

        <path class="hair ink" d="M168 430 C142 560 146 700 172 795 C196 812 232 800 228 776 C210 690 206 560 222 440Z M632 430 C658 560 654 700 628 795 C604 812 568 800 572 776 C590 690 594 560 578 440Z" stroke-width="9"/>
        <path class="hair ink" d="M170 480 C150 320 265 208 400 208 C535 208 650 320 630 480 C560 458 480 452 400 454 C320 452 240 458 170 480Z" stroke-width="9"/>
        <path d="M250 300 C320 255 470 250 550 290 M300 452 L304 418 M400 450 L400 414 M500 452 L496 418 M196 560 L192 700 M604 560 L608 700" fill="none" stroke="#6b4a36" stroke-width="7" stroke-linecap="round"/>
        <path d="M470 215 L408 172 L414 262 Z M470 215 L536 178 L526 266 Z" fill="#f06292" stroke="#c2185b" stroke-width="6" stroke-linejoin="round"/>

      </g></g>
    </svg>
  </div>
  <div id="table"></div>
  <div id="plate"><svg viewBox="0 0 220 100" preserveAspectRatio="none" aria-hidden="true"><ellipse cx="110" cy="58" rx="108" ry="40" fill="#0002"/><ellipse cx="110" cy="52" rx="108" ry="42" fill="#fff" stroke="#cfd8dc" stroke-width="3"/><ellipse cx="110" cy="52" rx="78" ry="28" fill="#f5f7f8" stroke="#e3e8ea" stroke-width="2"/></svg></div>
  <div id="bowl" role="button" aria-label="Soup"><svg viewBox="0 0 140 100" preserveAspectRatio="none" aria-hidden="true">
    <ellipse cx="70" cy="94" rx="40" ry="6" fill="#0002"/><path d="M4 28 Q8 92 70 92 Q132 92 136 28 Z" fill="#4fc3f7" stroke="#0288d1" stroke-width="3" stroke-linejoin="round"/>
    <path d="M22 50 Q70 70 118 50" fill="none" stroke="#fff" stroke-width="6" stroke-dasharray="2 12" stroke-linecap="round"/>
    <ellipse cx="70" cy="28" rx="66" ry="22" fill="#e1f5fe" stroke="#0288d1" stroke-width="3"/><ellipse cx="70" cy="28" rx="58" ry="17" fill="#fff"/></svg>
    <div class="pic"></div><div class="soup"></div></div>
  <div id="spoon"><svg viewBox="0 0 100 40" aria-hidden="true"><path d="M30 19 L95 23" stroke="#90a4ae" stroke-width="9" stroke-linecap="round"/><path d="M30 19 L95 23" stroke="#e0e6e9" stroke-width="5" stroke-linecap="round"/><ellipse cx="18" cy="20" rx="16" ry="11" fill="#e0e6e9" stroke="#90a4ae" stroke-width="2.5"/><ellipse class="dollop" cx="18" cy="19" rx="11" ry="6.5" fill="#fb8c00" opacity="0"/></svg></div>
  <a class="corner home" href="../index.html" aria-label="Menu"><svg viewBox="0 0 40 40"><path d="M6 19L20 7l14 12M11 16v16h18V16" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  <div id="overlay"></div>
</div>
<script>
const VEG={"carrot": "🥕", "broccoli": "🥦", "cucumber": "🥒", "tomato": "🍅", "peas": "🫛", "pepper": "🫑", "corn": "🌽"};
const VEGKIND={"carrot": "crunch", "broccoli": "crunch", "cucumber": "juicy", "tomato": "juicy", "peas": "pop", "pepper": "crunch", "corn": "crunch"};
const PICS={"kitten": "🐱", "bunny": "🐰", "star": "⭐", "sun": "🌞", "fish": "🐟"};
const $=id=>document.getElementById(id);
const stage=$("stage"), overlay=$("overlay"), sofia=$("sofia"), plate=$("plate"), bowl=$("bowl"), spoon=$("spoon"), power=$("power"), table=$("table");
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const NS="http://www.w3.org/2000/svg";
const A=(e,k,o)=>e.animate(k,o).finished.catch(()=>{});

/* ---------- Sofia's extras: a superhero cape behind her and sunglasses on her face ---------- */
const svg=sofia.querySelector("svg"), headG=svg.querySelector(".head > g"), armL=svg.querySelector(".arm.l"), armR=svg.querySelector(".arm.r");
const cheeks=[...headG.querySelectorAll('ellipse[fill="#ff8fab"]')];
{const g=document.createElementNS(NS,"g"); g.innerHTML=`<path class="cape" d="M270 925 Q400 895 530 925 L690 1520 Q400 1600 110 1520 Z" fill="#e53935" stroke="#1b1717" stroke-width="10" stroke-linejoin="round"/>`;
 svg.insertBefore(g,svg.querySelector("defs").nextSibling);
 const s=document.createElementNS(NS,"g"); s.setAttribute("class","shades");
 s.innerHTML=`<rect x="236" y="535" width="128" height="80" rx="30" fill="#212121"/><rect x="436" y="540" width="128" height="80" rx="30" fill="#212121"/>
   <path d="M364 568 Q400 552 436 572" fill="none" stroke="#212121" stroke-width="12"/><path d="M256 556 L290 556 M456 561 L490 561" stroke="#fff8" stroke-width="10" stroke-linecap="round"/>`;
 headG.appendChild(s)}
function onSofia(x,y){const r=sofia.getBoundingClientRect(); return [r.left+x/800*r.width, r.top+y/1730*r.height]}
const mouth=()=>onSofia(400,735);

/* ---------- audio ---------- */
let lang=store.get("veggie-lang")||"en";
let ctx=null, current=null;
function ac(){ if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)(); if(ctx.state!=="running") ctx.resume(); return ctx }
const decode=ab=>new Promise((res,rej)=>ac().decodeAudioData(ab,res,rej));
const cache={};
function load(url){return cache[url]||(cache[url]=fetch(url).then(r=>r.ok?r.arrayBuffer():Promise.reject()).then(decode).catch(()=>null))}
const clipUrl=k=>`audio/${k}-${lang}.mp3`, sndUrl=k=>`audio/${k}.mp3`;
function playBuffer(buf){return new Promise(res=>{const c=ac(),s=c.createBufferSource();s.buffer=buf;s.connect(c.destination);
  if(current) try{current.stop()}catch(e){}; current=s; s.onended=()=>{if(current===s) current=null; res()}; s.start(); setTimeout(res,buf.duration*1000+300)})}
function stopVoice(){if(current) try{current.stop()}catch(e){}; current=null}
let sayId=0;
async function say(keys,gap=200){const id=++sayId;
  for(const k of keys){ if(id!==sayId) return false;
    const buf=await load(clipUrl(k)); if(id!==sayId) return false;
    if(buf){sofia.classList.add("talk"); await playBuffer(buf); sofia.classList.remove("talk")}
    if(id!==sayId) return false; await wait(gap) }
  return id===sayId }
/* real crunches and slurps (recordings), played over the voice without stopping it */
async function sound(name,vol=1,rate=1){const buf=await load(sndUrl(name)); if(!buf) return; const c=ac(), s=c.createBufferSource(), g=c.createGain();
  s.buffer=buf; s.playbackRate.value=rate; g.gain.value=vol; s.connect(g).connect(c.destination); s.start(); return wait(buf.duration/rate*1000)}
const pick=a=>a[Math.floor(Math.random()*a.length)];
let lastCrunch=0;
function crunch(kind){
  if(kind==="juicy") return sound(`juicy-${1+Math.floor(Math.random()*3)}`,1,.95+Math.random()*.1);
  if(kind==="pop") return sound("crunch-2",1,1.3+Math.random()*.3);
  let n; do n=pick([1,3,4,5,6,7]); while(n===lastCrunch); lastCrunch=n;
  return sound(`crunch-${n}`,1,.92+Math.random()*.16);
}
function tone(type,f0,f1,t0,dur,vol=.3){
  const c=ac(),o=c.createOscillator(),g=c.createGain(); o.type=type;
  o.frequency.setValueAtTime(f0,t0); o.frequency.exponentialRampToValueAtTime(f1,t0+dur);
  g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+.02); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g).connect(c.destination); o.start(t0); o.stop(t0+dur+.05);
}
function noise(dur,type,freq,vol,when=0,f1){const c=ac(), n=c.sampleRate*dur, b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/n);
  const s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain(); s.buffer=b; f.type=type; f.frequency.value=freq; g.gain.value=vol;
  if(f1) f.frequency.exponentialRampToValueAtTime(f1,c.currentTime+when+dur);
  s.connect(f).connect(g).connect(c.destination); s.start(c.currentTime+when)}
const sfx={
  blow(){noise(.7,"bandpass",900,1.6,0,300)},
  poof(){const t=ac().currentTime; tone("sine",300,1200,t,.25,.2)},
  power(){const t=ac().currentTime; [523,659,784,1047,1319].forEach((f,i)=>tone("square",f,f,t+i*.08,.12,.06))},
  boing(){const t=ac().currentTime; [0,.45,.9].forEach(w=>tone("triangle",200,520,t+w,.3,.2))},
  zoom(){noise(.6,"bandpass",600,1.4,0,3000)},
  dance(){const t=ac().currentTime; [523,659,784,659,523,659,784,1047].forEach((f,i)=>tone("triangle",f,f,t+i*.18,.16,.18))},
  twinkle(){const t=ac().currentTime; [1568,2093,2637].forEach((f,i)=>tone("sine",f,f,t+i*.1,.3,.08))},
  whoosh(){noise(1.4,"bandpass",400,1.5,0,2500)},
  yay(){const t=ac().currentTime;[523,659,784,1047].forEach((f,i)=>tone("triangle",f,f,t+i*.12,.3,.25))}
};

/* ---------- little effects ---------- */
function fx(x,y,chars,n=4,size){for(let i=0;i<n;i++){const f=document.createElement("div"); f.className="fx"; f.textContent=chars[i%chars.length];
  f.style.cssText=`left:${x+(Math.random()*90-45)}px;top:${y}px;animation-delay:${i*.18}s${size?`;font-size:${size}px`:""}`; f.style.setProperty("--dx",(Math.random()*140-70)+"px");
  stage.appendChild(f); setTimeout(()=>f.remove(),2400)}}
const CRUMB={carrot:"#ff9800",broccoli:"#43a047",cucumber:"#9ccc65",tomato:"#e53935",peas:"#7cb342",pepper:"#66bb6a",corn:"#fdd835",soup:"#fb8c00"};
function crumbs(v){const [x,y]=mouth(); for(let i=0;i<14;i++){const c=document.createElement("div"); c.className="crumb";
  c.style.cssText=`left:${x+(Math.random()*40-20)}px;top:${y}px;background:${CRUMB[v]}`; c.style.setProperty("--dx",(Math.random()*180-90)+"px"); c.style.setProperty("--dy",(40+Math.random()*120)+"px");
  stage.appendChild(c); setTimeout(()=>c.remove(),900)}}
function arc(el,[ax,ay],[bx,by],ms=600){
  const h=Math.min(innerHeight*.18,Math.hypot(bx-ax,by-ay)*.3)+20, k=[];
  for(let i=0;i<=10;i++){const t=i/10; k.push({left:ax+(bx-ax)*t+"px",top:ay+(by-ay)*t-h*4*t*(1-t)+"px"})}
  return A(el,k,{duration:ms,easing:"ease-in-out",fill:"forwards"});
}
const centre=el=>{const r=el.getBoundingClientRect(); return [r.left+r.width/2,r.top+r.height/2]};
function chew(ms=1000){sofia.classList.add("talk"); setTimeout(()=>sofia.classList.remove("talk"),ms)}

/* ---------- what each vegetable does to Sofia ---------- */
const POWER={
  carrot(){ const [x,y]=onSofia(400,575); fx(x-40,y,["✨"],2,40); fx(x+40,y,["✨"],2,40);
    const s=document.createElement("div"); s.id="farstar"; s.textContent="⭐"; s.style.right="8vw"; s.style.top="16vh"; stage.appendChild(s); sfx.twinkle(); setTimeout(()=>s.remove(),3500) },
  broccoli(){ A(armL,[{transform:"rotate(0)"},{transform:"rotate(125deg)",offset:.25},{transform:"rotate(105deg)",offset:.5},{transform:"rotate(125deg)",offset:.75},{transform:"rotate(0)"}],{duration:2200});
    A(armR,[{transform:"rotate(0)"},{transform:"rotate(-125deg)",offset:.25},{transform:"rotate(-105deg)",offset:.5},{transform:"rotate(-125deg)",offset:.75},{transform:"rotate(0)"}],{duration:2200});
    const [x,y]=onSofia(400,500); fx(x-120,y,["💪"],2,54); fx(x+120,y,["💪"],2,54); sfx.power() },
  cucumber(){ sofia.classList.add("cool"); setTimeout(()=>sofia.classList.remove("cool"),3800); const [x,y]=onSofia(400,300); fx(x,y,["❄️","✨"],4); sfx.twinkle() },
  tomato(){ cheeks.forEach(c=>A(c,[{opacity:.45,transform:"scale(1)"},{opacity:1,transform:"scale(1.4)"},{opacity:1,transform:"scale(1.4)"},{opacity:.45,transform:"scale(1)"}],{duration:3000}));
    const [x,y]=onSofia(400,670); fx(x,y,["💕","💖"],4) },
  peas(){ sfx.boing(); A(sofia,[{translate:"-50% 0"},{translate:"-50% -12%"},{translate:"-50% 0"},{translate:"-50% -12%"},{translate:"-50% 0"},{translate:"-50% -12%"},{translate:"-50% 0"}],{duration:1400,easing:"ease-in-out"}) },
  pepper(){ sfx.zoom(); A(sofia,[{translate:"-50% 0"},{translate:"calc(-50% - 14vw) 0"},{translate:"calc(-50% + 14vw) 0"},{translate:"calc(-50% - 10vw) 0"},{translate:"calc(-50% + 10vw) 0"},{translate:"-50% 0"}],{duration:1300,easing:"ease-in-out"});
    const [x,y]=onSofia(400,800); fx(x,y,["💨"],4) },
  corn(){ sfx.dance(); A(sofia,[{rotate:"0deg"},{rotate:"-8deg"},{rotate:"8deg"},{rotate:"-8deg"},{rotate:"8deg"},{rotate:"0deg"}],{duration:1800});
    const [x,y]=onSofia(400,300); fx(x,y,["🎵","🎶","🌽"],5) },
};

/* ---------- the plate: drag a vegetable to Sofia's mouth, or tap it; three bites each ---------- */
let plateVeg=[], bitten={}, eaten=[], busy=true, phase="", hintT=[], firstBites=0;
function clearHints(){hintT.forEach(clearTimeout); hintT=[]; document.querySelectorAll(".help").forEach(e=>e.classList.remove("help"))}
function fillPlate(){
  plate.querySelectorAll(".veg").forEach(e=>e.remove());
  plateVeg.forEach((v,i)=>{const d=document.createElement("div"); d.className="veg"; d.dataset.v=v; d.style.left=(4+i*32)+"%"; d.innerHTML=`<span>${VEG[v]}</span>`; d.setAttribute("aria-label",v); plate.appendChild(d)});
}
const vegEl=v=>plate.querySelector(`.veg[data-v="${v}"]`);
function idleHints(){clearHints();
  const target=()=>{const left=plateVeg.filter(v=>!eaten.includes(v)); return vegEl(left.find(v=>bitten[v])||left[0])};
  hintT.push(setTimeout(()=>{if(busy||phase!=="plate") return; const e=target(); e?.classList.remove("wiggle"); void e?.offsetWidth; e?.classList.add("wiggle")},7000));
  hintT.push(setTimeout(()=>{if(busy||phase!=="plate") return; target()?.classList.add("help"); say(["feed"]); idleHints()},15000));
}
async function bite(v,from){
  busy=true; clearHints(); const el=vegEl(v);
  const g=document.createElement("div"); g.className="ghost"; g.innerHTML=el.innerHTML; g.style.fontSize=getComputedStyle(el).fontSize; el.classList.add("lift");
  if(bitten[v]) g.classList.add("b"+bitten[v]);
  g.style.left=from[0]+"px"; g.style.top=from[1]+"px"; stage.appendChild(g);
  await arc(g,from,mouth(),450);
  /* crunch! */
  const n=bitten[v]=(bitten[v]||0)+1; crunch(KIND[v]); chew(900); crumbs(v);
  A(sofia,[{scale:"1 1"},{scale:"1.03 .98"},{scale:"1 1"}],{duration:300});
  if(n>=3){
    g.remove(); el.remove(); eaten.push(v); sfx.poof();
    await wait(900); await say([`name-${v}`],100); fx(...mouth(),["⭐","✨"],3);
    const slot=power.querySelector(`.slot[data-v="${v}"]`); slot.classList.add("done"); sfx.power();
    const r=slot.getBoundingClientRect(); celebrate(r.left+r.width/2+"px",r.top+r.height/2+"px",.5);
    const said=say([`power-${v}`]); await wait(500); POWER[v](); await said; await wait(900);
    if(eaten.length>=plateVeg.length) return soupTime();
    say(["next"]); busy=false; idleHints(); return;
  }
  el.classList.remove("b1","b2"); el.classList.add("b"+n);
  await arc(g,mouth(),centre(el),450); g.remove(); el.classList.remove("lift");
  await wait(250);
  if(firstBites++<2) await say([n===1?`name-${v}`:"again"]); else await say([pick(["yum-1","yum-2","yum-3"])]);
  busy=false; idleHints();
}
let drag=null;
plate.addEventListener("pointerdown",e=>{
  const el=e.target.closest(".veg"); if(!el||busy||phase!=="plate"||!overlay.hidden) return; ac(); e.preventDefault();
  try{el.setPointerCapture(e.pointerId)}catch(_){}
  drag={el,v:el.dataset.v,x:e.clientX,y:e.clientY,id:e.pointerId,ghost:null};
});
plate.addEventListener("pointermove",e=>{
  if(!drag||e.pointerId!==drag.id) return;
  if(!drag.ghost&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>10){
    const g=drag.ghost=document.createElement("div"); g.className="ghost"+(bitten[drag.v]?` b${bitten[drag.v]}`:""); g.innerHTML=drag.el.innerHTML;
    g.style.fontSize=getComputedStyle(drag.el).fontSize; stage.appendChild(g); drag.el.classList.add("lift")}
  if(drag.ghost){drag.ghost.style.left=e.clientX+"px"; drag.ghost.style.top=e.clientY+"px"}
});
function endDrag(e,cancel){
  if(!drag||e.pointerId!==drag.id) return; const d=drag; drag=null;
  if(!d.ghost){ if(!cancel) bite(d.v,centre(d.el)); return }
  const [mx,my]=mouth(), r=sofia.getBoundingClientRect(), near=Math.hypot(e.clientX-mx,e.clientY-my)<Math.max(90,r.width*.5);
  d.ghost.remove();
  if(near&&!cancel) bite(d.v,[e.clientX,e.clientY]);
  else{ const g=document.createElement("div"); g.className="ghost"+(bitten[d.v]?` b${bitten[d.v]}`:""); g.innerHTML=d.el.innerHTML; g.style.fontSize=getComputedStyle(d.el).fontSize; stage.appendChild(g);
    arc(g,[e.clientX,e.clientY],centre(d.el),350).then(()=>{g.remove(); d.el.classList.remove("lift")}) }
}
plate.addEventListener("pointerup",e=>endDrag(e,false));
plate.addEventListener("pointercancel",e=>endDrag(e,true));

/* ---------- the soup: blow the steam away, then spoon by spoon; a surprise at the bottom ---------- */
let spoons=0, pic="kitten";
const SPOONS=5;
function placeSpoon(){const r=bowl.getBoundingClientRect(); spoon.style.left=(r.right-r.width*.2)+"px"; spoon.style.top=(r.top+r.height*.22)+"px"}
async function soupTime(){
  phase="soup"; busy=true; clearHints();
  const r=bowl.getBoundingClientRect(), steams=[];
  for(let i=0;i<3;i++){const s=document.createElement("div"); s.className="steam";
    s.innerHTML=`<svg viewBox="0 0 30 70" aria-hidden="true"><path d="M15 68 C2 55 28 45 15 32 C2 20 28 12 15 2" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".92"/></svg>`;
    s.style.left=(r.left+r.width*(.28+i*.22))+"px"; s.style.top=(r.top+r.height*.18)+"px"; s.style.animationDelay=(i*.4)+"s"; stage.appendChild(s); steams.push(s)}
  A(bowl,[{scale:"1"},{scale:"1.08"},{scale:"1"}],{duration:600});
  await say(["soup"]);
  await new Promise(res=>{
    let left=3, t=null;
    const nudge=()=>{t=setTimeout(()=>{steams.forEach(s=>s.isConnected&&s.classList.add("help")); t=setTimeout(()=>{say(["soup"]); nudge()},9000)},6000)};
    steams.forEach(s=>s.onclick=()=>{ac(); if(s.dataset.gone) return; s.dataset.gone=1; sfx.blow(); chew(500);
      A(s,[{opacity:1,transform:"translate(0,0)"},{opacity:0,transform:`translate(${Math.random()<.5?-20:20}vw,-30vh) scale(1.6)`}],{duration:900,fill:"forwards"})
        .then(()=>s.remove()); if(--left===0){clearTimeout(t); res()}});
    nudge();
  });
  await wait(600); await say(["cool"]);
  phase="spoon"; busy=false; spoonHints();
}
function spoonHints(){clearHints();
  hintT.push(setTimeout(()=>{if(!busy&&phase==="spoon") bowl.classList.add("help")},6000));
  hintT.push(setTimeout(()=>{if(!busy&&phase==="spoon"){say(["cool"]); spoonHints()}},15000));
}
bowl.addEventListener("click",async()=>{
  if(busy||phase!=="spoon"||!overlay.hidden) return; ac(); busy=true; clearHints();
  const r=bowl.getBoundingClientRect(), into=[r.left+r.width/2,r.top+r.height*.28], home=centre(spoon);
  await arc(spoon,home,into,350); spoon.classList.add("full");
  await arc(spoon,into,mouth(),550); spoon.classList.remove("full");
  sound(`slurp-${1+spoons%3}`); chew(800); crumbs("soup");
  spoons++; const soup=bowl.querySelector(".soup"); soup.style.scale=String(1-spoons*.12); soup.style.opacity=String(Math.max(0,1-spoons/SPOONS*1.05));
  await wait(700); await arc(spoon,mouth(),home,450); spoon.style.left=home[0]+"px"; spoon.style.top=home[1]+"px";
  if(spoons===2) await say(["soupyum"]); else if(spoons===4) await say(["yum-3"]);
  if(spoons<SPOONS){busy=false; spoonHints(); return}
  /* the bottom of the bowl */
  await wait(300); sfx.yay(); const p=bowl.querySelector(".pic"); celebrate(...centre(p).map(n=>n+"px"));
  A(p,[{scale:"1"},{scale:"1.8"},{scale:"1"}],{duration:900}); await say([`pic-${pic}`]);
  const slot=power.querySelector('.slot[data-v="soup"]'); slot.classList.add("done"); sfx.power();
  const [x,y]=onSofia(400,1100); fx(x,y,["❤️","💛"],4); await say(["warm"]); await wait(500);
  superSofia();
});

/* ---------- full power: Super Sofia flies over the clouds ---------- */
async function superSofia(){
  phase="super"; busy=true;
  table.classList.add("away"); plate.classList.add("away"); bowl.classList.add("away"); spoon.classList.add("away");
  const up=Math.max(0,sofia.getBoundingClientRect().bottom-innerHeight*.97), stand=`-50% ${-up}px`;   // she stands up: her feet come into view
  await A(sofia,[{translate:"-50% 0"},{translate:stand}],{duration:700,easing:"ease-out",fill:"forwards"});
  sofia.classList.add("super"); sfx.power(); const [cx,cy]=onSofia(400,1200); fx(cx,cy,["⚡","⭐"],5); await say(["super"]); await wait(300);
  const sky=$("sky"); sky.innerHTML=""; for(let i=0;i<5;i++){const c=document.createElement("div"); c.className="cloud"; c.style.top=(10+i*17)+"%"; c.style.left=(100+i*28)+"%"; sky.appendChild(c)}
  sky.classList.add("on"); sofia.classList.add("flying"); sfx.whoosh();
  sky.querySelectorAll(".cloud").forEach((c,i)=>A(c,[{transform:"translateX(0)"},{transform:"translateX(-260vw)"}],{duration:5200+i*300,easing:"linear"}));
  const said=say(["fly"]);
  A(armR,[{transform:"rotate(0)"},{transform:"rotate(-165deg)",offset:.15},{transform:"rotate(-165deg)",offset:.85},{transform:"rotate(0)"}],{duration:5200});
  await A(sofia,[{translate:stand,scale:"1",rotate:"0deg"},{translate:"-25% -16vh",scale:".6",rotate:"-14deg",offset:.25},{translate:"45% -24vh",scale:".55",rotate:"-10deg",offset:.5},
    {translate:"-95% -20vh",scale:".6",rotate:"-16deg",offset:.75},{translate:stand,scale:"1",rotate:"0deg"}],{duration:5200,easing:"ease-in-out",fill:"forwards"});
  const r=sofia.getBoundingClientRect(); celebrate(r.left+r.width/2+"px",r.top+r.height*.3+"px"); sfx.yay();
  await said; await wait(1200);
  if(overlay.hidden) startScreen(true);
}

/* ---------- a game ---------- */
const KIND=VEGKIND;
let round=0;
function pickVeg(){
  let q=null; try{q=JSON.parse(store.get("veggie-next"))}catch(e){}
  const ids=Object.keys(VEG); if(!Array.isArray(q)) q=shuffle([...ids]);
  q=q.filter(v=>ids.includes(v)); if(q.length<3) q=q.concat(shuffle(ids.filter(v=>!q.includes(v))));
  store.set("veggie-next",JSON.stringify(q.slice(3))); return q.slice(0,3);
}
function preload(){["start","feed","again","next","yum-1","yum-2","yum-3","soup","cool","soupyum","warm","super","fly",`pic-${pic}`].forEach(k=>load(clipUrl(k)));
  plateVeg.forEach(v=>{load(clipUrl(`name-${v}`)); load(clipUrl(`power-${v}`))});
  ["crunch-1","crunch-2","crunch-3","crunch-4","crunch-5","crunch-6","crunch-7","juicy-1","juicy-2","juicy-3","slurp-1","slurp-2","slurp-3"].forEach(k=>load(sndUrl(k)))}
function reset(){
  table.classList.remove("away"); plate.classList.remove("away"); bowl.classList.remove("away"); spoon.classList.remove("away");
  $("sky").classList.remove("on"); sofia.classList.remove("super","cool","flying","talk"); sofia.getAnimations().forEach(a=>a.cancel());
  document.querySelectorAll(".steam,.ghost,#farstar").forEach(e=>e.remove());
  const s=bowl.querySelector(".soup"); s.style.scale="1"; s.style.opacity="1";
}
async function play(l){
  ac(); lang=l; store.set("veggie-lang",l); document.documentElement.lang=l;
  overlay.hidden=true; reset(); busy=true; phase="plate"; bitten={}; eaten=[]; spoons=0; firstBites=0; round++;
  plateVeg=pickVeg(); pic=pick(Object.keys(PICS)); bowl.querySelector(".pic").textContent=PICS[pic];
  fillPlate(); placeSpoon(); preload();
  power.innerHTML=plateVeg.map(v=>`<div class="slot" data-v="${v}">${VEG[v]}</div>`).join("")+`<div class="slot" data-v="soup">🍲</div><div class="bolt">⚡</div>`;
  await say(["start","feed"]); busy=false; idleHints();
}
addEventListener("resize",()=>{if(phase!=="super") placeSpoon()});

/* ---------- start screen, and the chart of what she really ate ---------- */
const TITLE={en:"Veggie power!",ru:"Сила овощей!",lv:"Dārzeņu spēks!"};
const REAL={en:"🍽️ I ate it for real!",ru:"🍽️ Я скушала по-настоящему!",lv:"🍽️ Es apēdu pa īstam!"};
const REALQ={en:"What did you eat today?",ru:"Что ты сегодня скушала?",lv:"Ko tu šodien apēdi?"};
const DAYS={en:["Mo","Tu","We","Th","Fr","Sa","Su"],ru:["Пн","Вт","Ср","Чт","Пт","Сб","Вс"],lv:["P","O","T","C","Pk","S","Sv"]};
const BACK={en:"Back",ru:"Назад",lv:"Atpakaļ"};
const LNAME={en:"English",ru:"По-русски",lv:"Latviski"}, LEMO={en:"🥕🥦",ru:"🥒🍅",lv:"🌽🫑"};
const playIcon=`<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="var(--pink)"/><path d="M15 11l14 9-14 9z" fill="#fff"/></svg>`;
function startScreen(after){
  sayId++; stopVoice(); clearHints(); busy=true; phase=""; overlay.hidden=false;
  const got=after?[...eaten.map(v=>VEG[v]),"🍲",PICS[pic]]:[];
  overlay.innerHTML=`<h1>${after?TITLE[lang]:TITLE.en}</h1><p class="sub">${after?"":"Сила овощей! · Dārzeņu spēks!"}</p>
    ${after?`<div class="stickers">${got.map(e=>`<button class="sticker" aria-label="sticker">${e}</button>`).join("")}</div>`:""}
    <div class="langs">${["en","ru","lv"].map(l=>`<button class="go${l===lang?" last":""}" data-l="${l}" lang="${l}"><span class="e">${LEMO[l]}</span><span class="name">${LNAME[l]}</span>${playIcon}</button>`).join("")}</div>
    <button class="pill" id="realBtn">${REAL[lang]}</button>`;
  overlay.querySelectorAll(".go").forEach(b=>b.onclick=()=>play(b.dataset.l));
  overlay.querySelectorAll(".sticker").forEach(b=>b.onclick=()=>{ac(); crunch("crunch"); A(b,[{scale:"1"},{scale:"1.25"},{scale:"1"}],{duration:300})});
  $("realBtn").onclick=realChart;
}
const dayKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
function chartData(){try{return JSON.parse(store.get("veggie-chart"))||{}}catch(e){return {}}}
function realChart(){
  ac(); const data=chartData(), today=dayKey(new Date()); data[today]=data[today]||[];
  const now=new Date(), monday=new Date(now); monday.setDate(now.getDate()-((now.getDay()+6)%7));
  const week=[...Array(7)].map((_,i)=>{const d=new Date(monday); d.setDate(monday.getDate()+i); return dayKey(d)});
  const ALL=[...Object.keys(VEG),"soup"], emo=k=>k==="soup"?"🍲":VEG[k];
  const draw=()=>{
    overlay.innerHTML=`<h1 style="font-size:clamp(30px,5.5vw,56px)">${REALQ[lang]}</h1>
      <div class="eat">${ALL.map(k=>`<button data-k="${k}" class="${data[today].includes(k)?"got":""}" aria-label="${k}">${emo(k)}</button>`).join("")}</div>
      <div class="week">${week.map((d,i)=>`<div class="day${d===today?" today":""}"><b>${DAYS[lang][i]}</b><div class="st">${(data[d]||[]).map(emo).join("")}</div></div>`).join("")}</div>
      <button class="pill" id="backBtn">⬅ ${BACK[lang]}</button>`;
    overlay.querySelectorAll(".eat button").forEach(b=>b.onclick=()=>{
      const k=b.dataset.k; ac();
      if(k==="soup") sound(`slurp-${1+Math.floor(Math.random()*3)}`); else crunch(KIND[k]);
      if(!data[today].includes(k)){data[today].push(k); store.set("veggie-chart",JSON.stringify(data))}
      const [x,y]=centre(b); celebrate(x+"px",y+"px"); say([k==="soup"?"real-soup":"real-yes"]); draw()});
    $("backBtn").onclick=()=>startScreen(false);
  };
  draw(); say(["real-q"]);
}

/* the big "yes!" */
function celebrate(x,y,amount=1){
  const st=stage, STAR='M12 2l3 7 7 .6-5.4 4.7 1.7 7.2L12 17.8 5.7 21.5l1.7-7.2L2 9.6 9 9z';
  if(amount>=1){const big=document.createElementNS(NS,"svg"); big.setAttribute("viewBox","0 0 24 24"); big.classList.add("bigstar");
    big.innerHTML=`<path d="${STAR}" fill="#ffd25a" stroke="#f5a623" stroke-width="1.2" stroke-linejoin="round"/><circle cx="9.6" cy="11" r=".9" fill="#5a3a12"/><circle cx="14.4" cy="11" r=".9" fill="#5a3a12"/><path d="M9.8 13.6q2.2 1.8 4.4 0" fill="none" stroke="#5a3a12" stroke-width=".8" stroke-linecap="round"/>`;
    big.style.left=x; big.style.top=y; st.appendChild(big); setTimeout(()=>big.remove(),1200)}
  const COL=["#ffd25a","#f06292","#fff","#5fbf7f","#6ec6ff","#ff8a50","#b388ff"];
  for(let i=0;i<40*amount;i++){const s=document.createElementNS(NS,"svg"), z=22+Math.random()*44; s.setAttribute("viewBox","0 0 24 24"); s.classList.add("star");
    s.innerHTML=`<path d="${STAR}" fill="${COL[i%COL.length]}" stroke="#0002" stroke-width=".6"/>`;
    s.style.cssText=`left:${x};top:${y};width:${z}px;height:${z}px;margin:${-z/2}px 0 0 ${-z/2}px;animation-duration:${(1.5+Math.random()*.9).toFixed(2)}s`;
    s.style.setProperty("--dx",(Math.random()*90-45)+"vw"); s.style.setProperty("--dy",(Math.random()*90-45)+"vh");
    st.appendChild(s); setTimeout(()=>s.remove(),2600)}
  if(amount>=1) for(let i=0;i<34;i++){const c=document.createElement("div"); c.className="confetti";
    c.style.cssText=`left:${Math.random()*100}%;background:${COL[(i+2)%COL.length]};--dx:${(Math.random()*24-12).toFixed(1)}vw;--r:${Math.round(Math.random()*900-450)}deg;--t:${(2+Math.random()*1.2).toFixed(2)}s;--dl:${(Math.random()*.5).toFixed(2)}s`;
    if(i%3===0){c.style.borderRadius="50%"; c.style.height="13px"}
    st.appendChild(c); setTimeout(()=>c.remove(),3900)}
  try{const t=ac().currentTime; [1319,1568,1760,2093,2637].forEach((f,i)=>tone("sine",f,f*1.01,t+.05+i*.07,.25,.08))}catch(e){}
}
placeSpoon(); startScreen(false);
</script>
