<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>София в джунглях</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap">
<style>
/* layout: one full-screen jungle stage; Sofia's portrait left, a bush to tap right, a word card on top */
:root{
  --sky:#bfe9d6; --leaf:#2f8f5b; --leaf-dark:#1f6b43; --leaf-light:#5fbf7f;
  --ground:#8ccf6e; --ink:#24352b; --card:#fffdf6; --sun:#ffd25a; --pink:#f06292; --red:#d6453d;
  --display:"Nunito","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
  /* the pair (Sofia + bush) is centred: --sh Sofia's height, --sw her width, --bw the bush, --x0 the pair's left edge */
  --sh:min(64vh,560px,100vw); --bw:min(44vw,380px,60vh); --gap:1vw; --mw:92px;
  --sw:calc(var(--sh)*.4624); --x0:max(8px,calc(50% - (var(--sw) + var(--gap) + var(--bw))/2));
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--sky);color:var(--ink);font-family:var(--display);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#stage{position:relative;height:100%;overflow:hidden}
.layer{position:absolute;inset:0;pointer-events:none}
#far{background:
  radial-gradient(circle at 85% 12%,var(--sun) 0 46px,transparent 48px),
  radial-gradient(ellipse 30% 22% at 10% 72%,#7cc79a 98%,transparent),
  radial-gradient(ellipse 34% 26% at 45% 76%,#6ab98a 98%,transparent),
  radial-gradient(ellipse 30% 24% at 82% 74%,#7cc79a 98%,transparent)}
#ground{top:auto;height:24%;background:var(--ground);border-top:6px solid #76b95b}
.vine{position:absolute;top:-10px;width:10px;border-radius:0 0 8px 8px;background:var(--leaf-dark)}
.vine::after{content:"";position:absolute;bottom:-14px;left:-12px;width:34px;height:22px;border-radius:50% 50% 50% 0;background:var(--leaf)}
#scroller{transition:transform 1.1s ease-in-out}
#progress{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:5}
.dot{width:22px;height:22px;border-radius:50% 0 50% 0;background:#ffffff99;border:3px solid var(--leaf-dark);transition:background .3s,transform .3s}
.dot.done{background:var(--leaf-light);transform:rotate(45deg) scale(1.1)}

/* Sofia: her drawn head on an ink-style body; limbs swing from shoulders and hips when she walks */
#sofia{position:absolute;left:var(--x0);bottom:7%;height:var(--sh);aspect-ratio:800/1730;z-index:3;
  transform-origin:50% 100%;animation:bob 2.4s ease-in-out infinite}
#sofia svg{display:block;width:100%;height:100%;overflow:visible}
#sofia svg *{transform-box:view-box}
#sofia .ink{stroke:#1b1717;stroke-linecap:round;stroke-linejoin:round}
#sofia .skin{fill:#ffe3cf}
#sofia .hair{fill:#3b2a20}
#sofia .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
#sofia .mouth.open{opacity:0}
#sofia.talk .mouth.open{animation:flap .3s steps(1,end) infinite}
#sofia.talk .mouth.shut{animation:flap .3s steps(1,end) infinite -.15s}
#sofia .head{transform-origin:400px 870px}
#sofia .arm.l{transform-origin:262px 955px;animation:sway 2.4s ease-in-out infinite}
#sofia .arm.r{transform-origin:538px 955px;animation:sway 2.4s ease-in-out infinite reverse}
#sofia .leg.l{transform-origin:335px 1390px}
#sofia .leg.r{transform-origin:465px 1390px}
#sofia.walk{animation:stride .6s ease-in-out infinite}
#sofia.walk .leg.l{animation:stepL .6s ease-in-out infinite}
#sofia.walk .leg.r{animation:stepR .6s ease-in-out infinite}
#sofia.walk .arm.l{animation:swingL .6s ease-in-out infinite}
#sofia.walk .arm.r{animation:swingR .6s ease-in-out infinite}
#sofia.walk .head{animation:nod .6s ease-in-out infinite}
#sofia.talk .head{animation:chat .32s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes flap{0%{opacity:1}50%{opacity:0}}
@keyframes sway{50%{transform:rotate(4deg)}}
@keyframes stride{0%,50%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-3%) rotate(-2deg)}75%{transform:translateY(-3%) rotate(2deg)}}
@keyframes stepL{0%,50%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-60px) rotate(7deg)}}
@keyframes stepR{0%,50%,100%{transform:translateY(0) rotate(0)}75%{transform:translateY(-60px) rotate(-7deg)}}
@keyframes swingL{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(10deg)}}
@keyframes swingR{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(16deg)}}
@keyframes nod{0%,50%,100%{transform:rotate(0)}25%{transform:rotate(3deg)}75%{transform:rotate(-3deg)}}
@keyframes chat{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(3deg) scale(1.03)}}

#spot{position:absolute;left:calc(var(--x0) + var(--sw) + var(--gap));bottom:12%;width:var(--bw);aspect-ratio:1/1;max-width:100%;z-index:2;
  border:0;background:none;padding:0;cursor:pointer}
#spot:focus-visible{outline:5px dashed var(--sun);outline-offset:6px;border-radius:30px}
#animal{position:absolute;left:12%;right:12%;bottom:22%;transform:translateY(60%) scale(.4);opacity:0;
  transition:transform .6s cubic-bezier(.3,1.6,.5,1),opacity .3s}
#spot.open #animal{transform:translateY(-8%) scale(1);opacity:1}
#spot.open.talk #animal{animation:wiggle .5s ease-in-out infinite}
@keyframes wiggle{25%{rotate:-6deg}75%{rotate:6deg}}
#bush{position:absolute;inset:auto 0 0 0;transition:transform .4s}
#spot:not(.open) #bush{animation:shake 1.6s ease-in-out infinite}
#spot.open #bush{transform:translateY(18%)}
@keyframes shake{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-3deg)}82%{transform:rotate(3deg)}88%{transform:rotate(-2deg)}}
#hint{position:absolute;left:calc(var(--x0) + var(--sw) + var(--gap) + var(--bw)/2 - 34px);bottom:calc(12% + var(--bw)*.75);z-index:4;
  width:68px;height:68px;animation:tap 1.2s ease-in-out infinite;pointer-events:none}
@keyframes tap{50%{transform:translateY(12px) scale(.92)}}

#card{position:absolute;top:calc(56px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-30px);opacity:0;z-index:6;
  background:var(--card);border:4px solid var(--leaf-dark);border-radius:26px;padding:12px 26px;
  text-align:center;transition:.4s;max-width:calc(100% - 32px);pointer-events:none}
#card.show{opacity:1;transform:translate(-50%,0)}
/* Russian and Latvian always get the same size, weight and colour: neither language is the "main" one */
#card .ru,#card .lv{font-size:clamp(28px,5.2vw,46px);font-weight:900;line-height:1.15}
#card .snd{font-size:clamp(18px,3.4vw,28px);color:var(--pink);font-weight:900;margin-top:2px}

.big{position:absolute;z-index:7;border:0;cursor:pointer;font-family:var(--display);font-weight:900;color:#fff;
  background:var(--pink);box-shadow:0 8px 0 #b83b68;border-radius:999px;display:flex;align-items:center;gap:12px;justify-content:center;transition:transform .1s}
.big:active{transform:translateY(6px);box-shadow:0 2px 0 #b83b68}
.big:focus-visible{outline:5px solid var(--sun);outline-offset:4px}
#next{right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));padding:14px 30px;font-size:clamp(22px,4vw,32px)}
#next svg{width:40px;height:40px}
/* Sofia's own mic, beside her feet; the yellow ring runs down the 3 recording seconds */
#mic{left:max(8px,calc(var(--x0) + var(--sw)*.15 - var(--mw) - 4px));bottom:calc(7% + 10px);width:var(--mw);height:var(--mw);padding:0;
  background:var(--red);box-shadow:0 8px 0 #9c2f29}
#mic:active{box-shadow:0 2px 0 #9c2f29}
#mic .ic{width:48px;height:48px}
#mic .ring{position:absolute;inset:-9px;width:calc(100% + 18px);height:calc(100% + 18px);transform:rotate(-90deg);
  fill:none;stroke:var(--sun);stroke-width:7;stroke-linecap:round;stroke-dasharray:289;stroke-dashoffset:0;opacity:0}
#mic.rec{animation:micpulse .8s ease-in-out infinite}
#mic.rec .ring{opacity:1;animation:ring 3s linear forwards}
@keyframes micpulse{50%{transform:scale(1.1)}}
@keyframes ring{to{stroke-dashoffset:289}}

#overlay{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  background:#1f6b43ee;color:#fff;text-align:center;padding:24px}
#overlay h1{margin:0;font-size:clamp(34px,6.5vw,64px);font-weight:900;line-height:1.1;text-wrap:balance;display:flex;flex-direction:column;gap:.15em}
#overlay .big{position:static;width:min(40vw,180px);aspect-ratio:1;max-width:100%}
#overlay .big svg{width:46%;height:46%}
#overlay .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
#overlay .mini{width:84px;height:84px;border:0;background:var(--card);border-radius:24px;padding:6px;cursor:pointer}
#overlay .note{font-size:16px;font-weight:700;color:#d8f5dc;max-width:36ch;opacity:.9}
.corner{position:absolute;top:max(16px,env(safe-area-inset-top,0px));width:60px;height:60px;border-radius:50%;
  background:#ffffff33;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s,background .2s}
.corner svg{width:34px;height:34px}
.corner:focus-visible{outline:4px solid var(--sun)}
.home{left:max(16px,env(safe-area-inset-left,0px))}
#gear{right:max(16px,env(safe-area-inset-right,0px))}
#gear.hold{transform:scale(1.3) rotate(90deg);background:#ffffff66;transition:transform 1.2s linear,background 1.2s}

#parent{position:absolute;inset:0;z-index:20;background:var(--card);color:var(--ink);overflow-y:auto;-webkit-user-select:text;user-select:text;
  padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#parent .wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
#parent header{display:flex;align-items:center;justify-content:space-between;gap:12px}
#parent h2{margin:0;font-size:28px;font-weight:900}
#parent .lead{margin:0;font-size:17px;line-height:1.5;font-weight:700;color:#4c5e53}
#parent .group{border:3px solid #d5e8db;border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
#parent .group h3{margin:0;font-size:20px;font-weight:900;display:flex;align-items:center;gap:10px}
#parent .group h3 svg{width:44px;height:44px}
.clip{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.clip .lbl{flex:1 1 180px;min-width:0;font-size:17px;font-weight:700}
.clip .lbl small{display:block;font-size:14px;color:#6b7d72}
.clip .state{font-size:14px;font-weight:700;color:var(--leaf);min-width:74px}
.clip .state.none{color:#9aa79f}
.btn{font-family:var(--display);font-weight:900;font-size:15px;border:0;border-radius:12px;padding:10px 14px;cursor:pointer;background:#e4f2e8;color:var(--leaf-dark)}
.btn.rec{background:var(--red);color:#fff}
.btn.rec.on{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.btn:disabled{opacity:.4}
.btn:focus-visible{outline:3px solid var(--leaf)}
.btn.close{background:var(--leaf-dark);color:#fff;font-size:18px;padding:12px 20px}
#perr{color:var(--red);font-weight:700;font-size:15px}

.star{position:absolute;width:40px;height:40px;z-index:9;pointer-events:none;animation:fly 1.6s ease-out forwards}
@keyframes fly{from{transform:translate(0,0) scale(.3) rotate(0);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(240deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
@media (max-height:520px){#card{top:44px;padding:6px 18px}:root{--sh:60vh;--mw:72px}#mic .ic{width:38px;height:38px}}
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="far"></div>
  <div class="layer" id="scroller"></div>
  <div class="layer" id="ground"></div>
  <div id="progress" aria-label="Животные"></div>
  <div id="card" aria-live="polite"><div class="ru"></div><div class="lv" lang="lv"></div><div class="snd"></div></div>

  <div id="sofia" role="img" aria-label="София">
    <svg viewBox="0 0 800 1730" aria-hidden="true">
      <defs>
        <g id="leg">
          <path class="ink" d="M335 1380 L331 1640" fill="none" stroke-width="68"/>
          <path d="M335 1380 L331 1640" stroke="#ffe3cf" stroke-width="50" stroke-linecap="round"/>
          <path d="M331 1590 L331 1640" stroke="#fff" stroke-width="50"/>
          <path d="M305 1592 H357" stroke="#f06292" stroke-width="10" stroke-linecap="round"/>
          <ellipse class="ink" cx="318" cy="1672" rx="60" ry="34" fill="#d6453d" stroke-width="9"/>
          <ellipse cx="300" cy="1660" rx="16" ry="8" fill="#fff" opacity=".5"/>
        </g>
        <g id="arm">
          <path class="ink" d="M262 965 Q232 1085 218 1200" fill="none" stroke-width="64"/>
          <circle cx="216" cy="1222" r="34" fill="#1b1717"/>
          <path d="M262 965 Q232 1085 218 1200" fill="none" stroke="#ffe3cf" stroke-width="46" stroke-linecap="round"/>
          <circle class="skin" cx="216" cy="1222" r="25"/>
          <ellipse class="ink" cx="266" cy="955" rx="58" ry="48" fill="#f7a8c4" stroke-width="9"/>
        </g>
      </defs>
      <g class="leg l"><use href="#leg"/></g>
      <g class="leg r"><use href="#leg" transform="translate(800 0) scale(-1 1)"/></g>
      <path class="skin ink" d="M352 820 L350 925 Q400 950 450 925 L448 820Z" stroke-width="8"/>
      <path class="ink" d="M305 900 Q400 945 495 900 L535 918 Q565 990 562 1080 L640 1420 Q400 1478 160 1420 L238 1080 Q235 990 265 918 Z" fill="#f7a8c4" stroke-width="9"/>
      <path d="M190 1385 Q400 1440 610 1385" fill="none" stroke="#f06292" stroke-width="12" stroke-linecap="round" stroke-dasharray="2 34"/>
      <g fill="#fff" opacity=".8"><circle cx="330" cy="1060" r="13"/><circle cx="450" cy="1110" r="13"/><circle cx="390" cy="1210" r="13"/><circle cx="280" cy="1270" r="13"/><circle cx="510" cy="1260" r="13"/><circle cx="400" cy="1340" r="13"/><circle cx="240" cy="1370" r="12"/><circle cx="560" cy="1370" r="12"/></g>
      <path class="ink" d="M308 902 Q322 980 400 950 L400 930 Q352 936 308 902Z M492 902 Q478 980 400 950 L400 930 Q448 936 492 902Z" fill="#fff" stroke-width="7"/>
      <g class="arm l"><use href="#arm"/></g>
      <g class="arm r"><use href="#arm" transform="translate(800 0) scale(-1 1)"/></g>
      <g class="head"><g transform="rotate(-4 400 560)">
        <!-- cartoon Sofia after her portrait: round cheeks, top-knot curling right; Amélie-style bob with short blunt bangs -->
        <path class="hair ink" d="M118 600 C92 360 212 168 400 166 C588 168 708 360 682 600 L694 770 C698 812 650 822 616 800 L184 800 C150 822 102 812 106 770Z" stroke-width="9"/>
        <g class="tuft">
          <path class="hair ink" d="M448 230 C400 175 345 150 290 158 C345 118 425 140 472 212Z" stroke-width="9"/>
          <path class="hair ink" d="M450 225 C428 140 455 70 515 25 C512 95 512 160 490 228Z" stroke-width="9"/>
          <path class="hair ink" d="M462 228 C495 120 600 62 688 102 C712 150 680 196 648 170 C668 140 632 118 600 128 C555 145 525 185 500 240Z" stroke-width="9"/>
          <path d="M468 200 C470 140 485 95 508 60 M495 210 C530 145 590 112 650 115" fill="none" stroke="#6b4a36" stroke-width="6" stroke-linecap="round"/>
        </g>
        <path class="skin ink" d="M158 540 C158 360 270 280 400 280 C530 280 642 360 642 540 C642 700 610 795 530 842 C475 872 325 872 270 842 C190 795 158 700 158 540Z" stroke-width="9"/>
        <path d="M262 505 Q300 485 340 500 M462 508 Q502 490 542 506" fill="none" stroke="#3b2a20" stroke-width="10" stroke-linecap="round"/>
        <g class="eye"><ellipse cx="300" cy="575" rx="27" ry="33" fill="#1b1717"/><circle cx="290" cy="563" r="10" fill="#fff"/><circle cx="310" cy="590" r="4.5" fill="#fff"/></g>
        <g class="eye"><ellipse cx="500" cy="580" rx="27" ry="33" fill="#1b1717"/><circle cx="490" cy="568" r="10" fill="#fff"/><circle cx="510" cy="595" r="4.5" fill="#fff"/></g>
        <ellipse cx="252" cy="668" rx="46" ry="30" fill="#ff8fab" opacity=".45"/>
        <ellipse cx="548" cy="672" rx="46" ry="30" fill="#ff8fab" opacity=".45"/>
        <path d="M388 640 Q400 656 414 640" fill="none" stroke="#c98f7a" stroke-width="8" stroke-linecap="round"/>
        <path class="mouth shut" d="M345 705 Q400 752 455 705" fill="none" stroke="#1b1717" stroke-width="10" stroke-linecap="round"/>
        <g class="mouth open"><path d="M350 700 Q400 706 450 700 Q444 768 400 772 Q356 768 350 700Z" fill="#8e2a3a" stroke="#1b1717" stroke-width="8" stroke-linejoin="round"/><ellipse cx="400" cy="752" rx="26" ry="12" fill="#f28b9b"/></g>
        <path class="hair ink" d="M168 430 C142 560 146 700 172 795 C196 812 232 800 228 776 C210 690 206 560 222 440Z M632 430 C658 560 654 700 628 795 C604 812 568 800 572 776 C590 690 594 560 578 440Z" stroke-width="9"/>
        <path class="hair ink" d="M170 480 C150 320 265 208 400 208 C535 208 650 320 630 480 C560 458 480 452 400 454 C320 452 240 458 170 480Z" stroke-width="9"/>
        <path d="M250 300 C320 255 470 250 550 290 M300 452 L304 418 M400 450 L400 414 M500 452 L496 418 M196 560 L192 700 M604 560 L608 700" fill="none" stroke="#6b4a36" stroke-width="7" stroke-linecap="round"/>
        <path d="M470 215 L408 172 L414 262 Z M470 215 L536 178 L526 266 Z" fill="#f06292" stroke="#c2185b" stroke-width="6" stroke-linejoin="round"/>
        <circle cx="470" cy="217" r="21" fill="#e04a7f" stroke="#c2185b" stroke-width="6"/>
      </g></g>
    </svg>
  </div>

  <button id="spot" aria-label="Кто там? Нажми на куст">
    <div id="animal"></div>
    <svg id="bush" viewBox="0 0 400 230" aria-hidden="true">
      <ellipse cx="200" cy="200" rx="200" ry="40" fill="#1f6b43"/>
      <circle cx="80" cy="150" r="78" fill="#2f8f5b"/><circle cx="320" cy="150" r="78" fill="#2f8f5b"/>
      <circle cx="200" cy="112" r="96" fill="#3fa36a"/><circle cx="140" cy="176" r="60" fill="#5fbf7f"/><circle cx="270" cy="178" r="58" fill="#5fbf7f"/>
      <circle cx="118" cy="104" r="10" fill="#f06292"/><circle cx="262" cy="70" r="10" fill="#ffd25a"/><circle cx="300" cy="140" r="9" fill="#f06292"/><circle cx="170" cy="60" r="8" fill="#fff"/>
    </svg>
  </button>
  <svg id="hint" viewBox="0 0 64 64" aria-hidden="true"><path d="M24 8a5 5 0 0 1 10 0v20l14 3a6 6 0 0 1 5 7l-3 16a6 6 0 0 1-6 5H28a6 6 0 0 1-5-3L12 38a4 4 0 0 1 6-5l6 5z" fill="#fff" stroke="#24352b" stroke-width="3" stroke-linejoin="round"/></svg>

  <button id="next" class="big" hidden aria-label="Дальше"><span>Дальше</span><svg viewBox="0 0 40 40"><path d="M8 20h22M20 9l11 11-11 11" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

  <button id="mic" class="big" hidden aria-label="Скажи сама!"><svg class="ic" viewBox="0 0 40 40"><rect x="14" y="4" width="12" height="20" rx="6" fill="#fff"/><path d="M8 19a12 12 0 0 0 24 0M20 31v5" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg><svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46"/></svg></button>

  <div id="overlay"></div>
  <div id="parent" hidden></div>
</div>

<script>
const A = s => `<svg viewBox="0 0 200 200">${s}</svg>`;
const animals = [
 {id:"monkey", ru:"Обезьяна", lv:"Pērtiķis", snd:"У-у-а-а!", svg:A(`
  <ellipse cx="100" cy="160" rx="48" ry="40" fill="#8a5a3b"/>
  <circle cx="44" cy="88" r="22" fill="#8a5a3b"/><circle cx="156" cy="88" r="22" fill="#8a5a3b"/>
  <circle cx="44" cy="88" r="12" fill="#e8c39e"/><circle cx="156" cy="88" r="12" fill="#e8c39e"/>
  <circle cx="100" cy="86" r="56" fill="#8a5a3b"/>
  <path d="M60 96 Q60 60 86 64 Q100 74 114 64 Q140 60 140 96 Q140 132 100 134 Q60 132 60 96Z" fill="#e8c39e"/>
  <circle cx="84" cy="88" r="8" fill="#24352b"/><circle cx="116" cy="88" r="8" fill="#24352b"/>
  <circle cx="86" cy="85" r="3" fill="#fff"/><circle cx="118" cy="85" r="3" fill="#fff"/>
  <path d="M82 112 Q100 126 118 112" fill="none" stroke="#24352b" stroke-width="5" stroke-linecap="round"/>`)},
 {id:"elephant", ru:"Слон", lv:"Zilonis", snd:"Ту-ру-ру!", svg:A(`
  <path d="M30 70 Q8 110 40 140 Q60 150 70 120Z" fill="#a3aebb"/><path d="M170 70 Q192 110 160 140 Q140 150 130 120Z" fill="#a3aebb"/>
  <ellipse cx="100" cy="92" rx="62" ry="58" fill="#b9c3cf"/>

    {key:a.id+"-sound", label:a.snd, sub:"Звук животного (можно голосом!)", group:a}]),
  {key:"end-ru", label:"Молодец, София!", sub:"Конец игры, по-русски"},
  {key:"end-lv", label:"Malacis, Sofija!", sub:"Конец игры, по-латышски"},
];

const $ = id => document.getElementById(id);
const spot=$("spot"), animalEl=$("animal"), card=$("card"), next=$("next"), hint=$("hint"), overlay=$("overlay"), scroller=$("scroller"), sofia=$("sofia"), parent=$("parent");
const mic=$("mic");
let idx=0, opened=false, busy=false, ctx=null, scrollX=0, round=[];
let micOK=!!(navigator.mediaDevices&&window.MediaRecorder);

/* each game meets ROUND animals, picked at random */
const ROUND=6;
function newRound(){
  const pool=[...animals]; for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  round=pool.slice(0,ROUND); idx=0; scrollX=0;
  scroller.style.transition="none"; scroller.style.transform="translateX(0)"; requestAnimationFrame(()=>scroller.style.transition="");
  document.querySelectorAll(".dot").forEach(d=>d.classList.remove("done"));
}
for(let i=0;i<ROUND;i++){const d=document.createElement("div");d.className="dot";$("progress").appendChild(d)}
for(let i=0;i<40;i++){const v=document.createElement("div");v.className="vine";
  v.style.left=(i*13+Math.random()*6)+"vw";v.style.height=(18+Math.random()*28)+"vh";scroller.appendChild(v)}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- audio engine ---------- */
function ac(){ if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)(); if(ctx.state!=="running") ctx.resume(); return ctx }
let current=null;
function playBuffer(buf){return new Promise(res=>{const c=ac(),s=c.createBufferSource();s.buffer=buf;s.connect(c.destination);
  if(current) try{current.stop()}catch(e){}; current=s; s.onended=()=>res(); s.start(); setTimeout(res,buf.duration*1000+300)})}
const decode=ab=>new Promise((res,rej)=>ac().decodeAudioData(ab,res,rej));

/* family recordings live on this iPad (IndexedDB); files in audio/ are the backup */
let dbp=null;
function db(){ if(!dbp) dbp=new Promise((res,rej)=>{const r=indexedDB.open("sofia-audio",1);
  r.onupgradeneeded=()=>r.result.createObjectStore("clips"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error)}); return dbp }
async function dbDo(mode,fn){const d=await db();return new Promise((res,rej)=>{const t=d.transaction("clips",mode),q=fn(t.objectStore("clips"));q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
const getRec=k=>dbDo("readonly",s=>s.get(k)).catch(()=>null);
const putRec=(k,b)=>dbDo("readwrite",s=>s.put(b,k));
const delRec=k=>dbDo("readwrite",s=>s.delete(k));
const cache={};
async function loadClip(key){
  if(cache[key]!==undefined) return cache[key];
  let buf=null;
  const blob=await getRec(key);
  if(blob){ try{buf=await decode(await blob.arrayBuffer())}catch(e){} }
  if(!buf) for(const ext of ["mp3","m4a","wav"]){
    try{const r=await fetch(`audio/${key}.${ext}`); if(r.ok){buf=await decode(await r.arrayBuffer()); break}}catch(e){}
  }
  return cache[key]=buf;
}
async function playClip(key,talker){
  const buf=await loadClip(key); if(!buf) return false;
  talker&&talker.classList.add("talk"); await playBuffer(buf); talker&&talker.classList.remove("talk"); return true;
}

/* generated animal sounds, used only when there is no recording and no file in audio/ (e.g. the snake) */
function tone(type,f0,f1,t0,dur,vol=.3,filt){
  const c=ac(),o=c.createOscillator(),g=c.createGain(); o.type=type;
  o.frequency.setValueAtTime(f0,t0); o.frequency.exponentialRampToValueAtTime(f1,t0+dur);
  g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+.03); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  let n=o; if(filt){const f=c.createBiquadFilter();f.type=filt.type;f.frequency.value=filt.f;f.Q.value=filt.q||1;o.connect(f);n=f}
  n.connect(g).connect(c.destination); o.start(t0); o.stop(t0+dur+.05); return o;
}
function noise(t0,dur,vol,type,f,q=1,sweepTo){
  const c=ac(),b=c.createBuffer(1,c.sampleRate*dur,c.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  const s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain(); s.buffer=b; fl.type=type; fl.frequency.setValueAtTime(f,t0); fl.Q.value=q;
  if(sweepTo) fl.frequency.exponentialRampToValueAtTime(sweepTo,t0+dur);
  g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+.08); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  s.connect(fl).connect(g).connect(c.destination); s.start(t0);
}
const synth={
  monkey(){const t=ac().currentTime;[0,.22,.44].forEach(d=>tone("triangle",420,780,t+d,.18,.35));tone("sawtooth",900,500,t+.7,.35,.25,{type:"lowpass",f:1800});tone("sawtooth",950,520,t+1.1,.35,.25,{type:"lowpass",f:1800});return 1.5},
  elephant(){const t=ac().currentTime,o=tone("sawtooth",320,520,t,1.1,.35,{type:"bandpass",f:900,q:2});
    const lfo=ac().createOscillator(),lg=ac().createGain();lfo.frequency.value=9;lg.gain.value=25;lfo.connect(lg).connect(o.frequency);lfo.start(t);lfo.stop(t+1.1);return 1.2},
  lion(){const t=ac().currentTime;tone("sawtooth",140,70,t,1.3,.4,{type:"lowpass",f:500});noise(t,1.3,.35,"lowpass",700,1,200);return 1.4},
  parrot(){const t=ac().currentTime;[0,.32].forEach(d=>{tone("sawtooth",1300,2000,t+d,.12,.25,{type:"bandpass",f:1800,q:3});tone("square",2000,1100,t+d+.12,.12,.15,{type:"bandpass",f:1600,q:3})});return .8},
  snake(){const t=ac().currentTime;noise(t,1.4,.3,"highpass",3500,.7);return 1.4},
  gorilla(){const t=ac().currentTime;[0,.13,.26,.39,.52,.65].forEach((d,i)=>{tone("sine",i%2?120:150,55,t+d,.12,.7);noise(t+d,.07,.25,"lowpass",400)});return .9},
  crocodile(){const t=ac().currentTime;[0,.4].forEach(d=>{noise(t+d,.05,.6,"bandpass",2200,2);tone("square",700,120,t+d,.06,.25,{type:"lowpass",f:2000});tone("sine",110,60,t+d+.01,.12,.5)});return .7},
  frog(){const t=ac().currentTime;[0,.45].forEach(d=>{tone("square",180,120,t+d,.22,.3,{type:"lowpass",f:900});tone("square",240,160,t+d+.08,.14,.18,{type:"lowpass",f:900})});return 1},
  yay(){const t=ac().currentTime;[523,659,784,1047].forEach((f,i)=>tone("triangle",f,f,t+i*.12,.3,.25));return .7},
  pop(){const t=ac().currentTime;tone("sine",300,900,t,.12,.3);return .2}
};

/* ---------- game flow ---------- */
function setAnimal(){const a=round[idx];animalEl.innerHTML=a.svg;card.querySelector(".ru").textContent=a.ru;card.querySelector(".lv").textContent=a.lv;card.querySelector(".snd").textContent=a.snd}
async function perform(){
  if(busy) return; busy=true; const a=round[idx];
  spot.classList.add("talk");
  if(!await playClip(a.id+"-sound")) await wait((synth[a.id]||synth.pop)()*1000+200);
  spot.classList.remove("talk");
  await wait(200); await playClip(a.id+"-ru",sofia); await wait(250); await playClip(a.id+"-lv",sofia);
  busy=false;
}
spot.addEventListener("click",async()=>{
  ac();
  if(!opened){opened=true;hint.toggleAttribute("hidden",true);synth.pop();spot.classList.add("open");card.classList.add("show");
    document.querySelectorAll(".dot")[idx].classList.add("done");
    await wait(500); await perform(); next.hidden=false; mic.hidden=!micOK; return}
  perform();
});
next.addEventListener("click",async()=>{
  if(busy) return; next.hidden=true; mic.hidden=true; card.classList.remove("show"); spot.classList.remove("open"); opened=false;
  if(idx===round.length-1){finale();return}
  busy=true; sofia.classList.add("walk"); scrollX-=60; scroller.style.transform=`translateX(${scrollX}vw)`;
  spot.style.transition="transform 1.1s ease-in-out"; spot.style.transform="translateX(120vw)";
  await wait(500); idx++; setAnimal(); spot.style.transition="none"; spot.style.transform="translateX(120vw)";
  requestAnimationFrame(()=>requestAnimationFrame(()=>{spot.style.transition="transform .8s ease-out";spot.style.transform="translateX(0)"}));
  await wait(900); sofia.classList.remove("walk"); hint.toggleAttribute("hidden",false); busy=false;
});
function stars(){for(let i=0;i<24;i++){const s=document.createElementNS("http://www.w3.org/2000/svg","svg");s.setAttribute("viewBox","0 0 24 24");s.classList.add("star");
  s.innerHTML='<path d="M12 2l3 7 7 .6-5.4 4.7 1.7 7.2L12 17.8 5.7 21.5l1.7-7.2L2 9.6 9 9z" fill="'+["#ffd25a","#f06292","#fff","#5fbf7f"][i%4]+'"/>';
  s.style.left="50%";s.style.top="45%";s.style.setProperty("--dx",(Math.random()*90-45)+"vw");s.style.setProperty("--dy",(Math.random()*80-40)+"vh");
  $("stage").appendChild(s);setTimeout(()=>s.remove(),1700)}}

const homeBtn=`<a class="corner home" href="../index.html" aria-label="Меню"><svg viewBox="0 0 40 40"><path d="M6 19L20 7l14 12M11 16v16h18V16" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></a>`;
const gearBtn=`<button class="corner" id="gear" aria-label="Голоса для родителей: удерживайте"><svg viewBox="0 0 40 40"><rect x="15" y="5" width="10" height="18" rx="5" fill="none" stroke="#fff" stroke-width="3.5"/><path d="M9 19a11 11 0 0 0 22 0M20 30v5" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/></svg></button>`;

/* Sofia's turn: one tap records 3 s (no stop button for little hands), then plays it straight back */
async function kidRecord(){
  if(busy) return; busy=true; ac();
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}
  catch(e){micOK=false; mic.hidden=true; busy=false; return}
  const chunks=[], r=new MediaRecorder(stream), stopped=new Promise(res=>r.onstop=res);
  r.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  mic.classList.add("rec"); r.start(); await wait(3000); r.stop(); await stopped;
  stream.getTracks().forEach(t=>t.stop()); mic.classList.remove("rec");
  let buf=null; const blob=new Blob(chunks,{type:r.mimeType||"audio/mp4"});
  if(blob.size>500) try{buf=await decode(await blob.arrayBuffer())}catch(e){}
  if(buf){ await wait(200); sofia.classList.add("talk"); await playBuffer(buf); sofia.classList.remove("talk"); synth.yay(); stars() }
  busy=false;
}
mic.addEventListener("click",kidRecord);

async function walkIn(){
  sofia.classList.add("walk");
  await sofia.animate([{translate:"-45vw 0"},{translate:"0 0"}],{duration:1800,easing:"ease-out"}).finished.catch(()=>{});
  sofia.classList.remove("walk");
}
async function countRecorded(){let n=0;for(const c of clips) if(await getRec(c.key)) n++;return n}
async function startScreen(){
  overlay.hidden=false;
  overlay.innerHTML=`${homeBtn}${gearBtn}<h1><span>София в джунглях</span><span lang="lv">Sofija džungļos</span></h1>
    <button class="big" id="play" aria-label="Играть"><svg viewBox="0 0 40 40"><path d="M12 7l22 13-22 13z" fill="#fff"/></svg></button>
    <div class="note" id="note" hidden>Для родителей: удерживайте микрофон в углу, чтобы записать слова своим голосом.</div>`;
  bindGear();
  $("play").onclick=async()=>{ac();synth.pop();overlay.hidden=true;await walkIn();await playClip("greet-ru",sofia);await wait(250);playClip("greet-lv",sofia)};
  if(await countRecorded()===0) $("note").hidden=false;
}
function finale(){
  synth.yay(); stars(); overlay.hidden=false;
  overlay.innerHTML=`${homeBtn}<h1><span>Молодец, София!</span><span lang="lv">Malacis, Sofija!</span></h1>
   <div class="row">${round.map((a,i)=>`<button class="mini" data-i="${i}" aria-label="${a.ru}">${a.svg}</button>`).join("")}</div>
   <button class="big" id="again" aria-label="Ещё раз"><svg viewBox="0 0 40 40"><path d="M30 14a12 12 0 1 0 2 10" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M32 5v10H22" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`;
  playClip("end-ru").then(()=>wait(250)).then(()=>playClip("end-lv"));
  overlay.querySelectorAll(".mini").forEach(b=>b.onclick=async()=>{const a=round[+b.dataset.i];
    if(!await playClip(a.id+"-sound")) await wait((synth[a.id]||synth.pop)()*1000);
    await playClip(a.id+"-ru"); await wait(200); playClip(a.id+"-lv")});
  $("again").onclick=()=>{newRound();setAnimal();overlay.hidden=true;hint.toggleAttribute("hidden",false)};
}

/* ---------- parent corner: record family voices ---------- */
function bindGear(){
  const g=$("gear"); let t=null;
  const start=e=>{e.preventDefault();g.classList.add("hold");t=setTimeout(()=>{g.classList.remove("hold");openParent()},1200)};
  const stop=()=>{clearTimeout(t);g.classList.remove("hold")};
  g.addEventListener("pointerdown",start); ["pointerup","pointerleave","pointercancel"].forEach(ev=>g.addEventListener(ev,stop));
  g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" ")openParent()});
}
let recorder=null, recKey=null;
function clipRow(c){return `<div class="clip" data-key="${c.key}">
  <div class="lbl">${c.label}<small>${c.sub}</small></div>
  <span class="state none">нет записи</span>
  <button class="btn rec" data-act="rec">Записать</button>
  <button class="btn" data-act="play" disabled>Слушать</button>
  <label class="btn" style="display:inline-block">Файл<input type="file" accept="audio/*" data-act="file" hidden></label>
  <button class="btn" data-act="del" disabled>Удалить</button></div>`}
async function openParent(){
  ac();
  const intro=clips.filter(c=>!c.group&&c.key.startsWith("greet")), outro=clips.filter(c=>c.key.startsWith("end"));
  parent.innerHTML=`<div class="wrap">
   <header><h2>Голоса для Софии</h2><button class="btn close" id="pclose">Готово</button></header>
   <p class="lead">Нажмите «Записать», скажите слово и нажмите «Стоп». Записи хранятся на этом iPad. Звуки животных тоже можно изобразить голосом, детям это нравится больше всего.</p>
   <div id="perr" hidden></div>
   <div class="group"><h3>Начало</h3>${intro.map(clipRow).join("")}</div>
   ${animals.map(a=>`<div class="group"><h3>${a.svg}${a.ru} · ${a.lv}</h3>${clips.filter(c=>c.group===a).map(clipRow).join("")}</div>`).join("")}
   <div class="group"><h3>Конец</h3>${outro.map(clipRow).join("")}</div>
   <p class="lead" style="font-size:14px">Звуки животных взяты с Wikimedia Commons: <a href="audio/CREDITS.txt">авторы и лицензии</a>. Ваша запись звука заменяет их.</p></div>`;
  parent.hidden=false; parent.scrollTop=0;
  $("pclose").onclick=()=>{if(recorder&&recorder.state==="recording")recorder.stop();parent.hidden=true;startScreen()};
  for(const row of parent.querySelectorAll(".clip")) refreshRow(row);
  parent.onclick=e=>{const b=e.target.closest("[data-act]");if(!b||b.dataset.act==="file")return;const row=b.closest(".clip");act(b.dataset.act,row,b)};
  parent.onchange=async e=>{const inp=e.target;if(inp.dataset.act!=="file"||!inp.files[0])return;const row=inp.closest(".clip");
    try{await decode(await inp.files[0].arrayBuffer())}catch(err){showErr("Этот файл не получается прочитать. Попробуйте MP3 или M4A.");return}
    await putRec(row.dataset.key,inp.files[0]);delete cache[row.dataset.key];refreshRow(row);inp.value=""};
}
async function refreshRow(row){const has=!!await getRec(row.dataset.key),st=row.querySelector(".state");
  st.textContent=has?"записано":"нет записи";st.classList.toggle("none",!has);
  row.querySelector('[data-act="play"]').disabled=!has;row.querySelector('[data-act="del"]').disabled=!has}
function showErr(m){const e=$("perr");e.textContent=m;e.hidden=!m}
async function act(kind,row,btn){
  const key=row.dataset.key; showErr("");
  if(kind==="play"){delete cache[key];playClip(key);return}
  if(kind==="del"){await delRec(key);delete cache[key];refreshRow(row);return}
  if(kind==="rec"){
    if(recorder&&recorder.state==="recording"){recorder.stop();return}
    if(!navigator.mediaDevices||!window.MediaRecorder){showErr("Запись не поддерживается в этом браузере. Откройте игру в Safari по адресу сайта, а не из файла.");return}
    let stream;
    try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}
    catch(e){showErr("Нет доступа к микрофону. Разрешите микрофон для Safari: Настройки → Safari → Микрофон.");return}
    const chunks=[]; recorder=new MediaRecorder(stream); recKey=key;
    recorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);
    recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());btn.textContent="Записать";btn.classList.remove("on");
      const blob=new Blob(chunks,{type:recorder.mimeType||"audio/mp4"});
      if(blob.size<500){showErr("Запись получилась пустой. Попробуйте ещё раз.");return}
      await putRec(recKey,blob);delete cache[recKey];refreshRow(row);playClip(recKey)};
    recorder.start(); btn.textContent="Стоп"; btn.classList.add("on");
    setTimeout(()=>{if(recorder&&recorder.state==="recording"&&recKey===key)recorder.stop()},8000);
  }
}

newRound();
setAnimal();
startScreen();
</script>
