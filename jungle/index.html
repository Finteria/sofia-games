<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sofia in the Jungle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap">
</head>
<body>
<style>
/* layout: one full-screen jungle stage; Sofia left, a bush to tap right, a word card on top */
:root{
  --sky:#bfe9d6; --leaf:#2f8f5b; --leaf-dark:#1f6b43; --leaf-light:#5fbf7f;
  --ground:#8ccf6e; --ink:#24352b; --card:#fffdf6; --sun:#ffd25a; --pink:#f06292;
  --display:"Nunito","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--display);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#stage{position:relative;height:100%;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.layer{position:absolute;inset:0;pointer-events:none}
#far{background:
  radial-gradient(circle at 85% 12%,var(--sun) 0 46px,transparent 48px),
  radial-gradient(ellipse 30% 22% at 10% 72%,#7cc79a 98%,transparent),
  radial-gradient(ellipse 34% 26% at 45% 76%,#6ab98a 98%,transparent),
  radial-gradient(ellipse 30% 24% at 82% 74%,#7cc79a 98%,transparent)}
#ground{top:auto;height:24%;background:var(--ground);border-top:6px solid #76b95b}
.vine{position:absolute;top:-10px;width:10px;border-radius:0 0 8px 8px;background:var(--leaf-dark)}
.vine::after{content:"";position:absolute;bottom:-14px;left:-12px;width:34px;height:22px;border-radius:50% 50% 50% 0;background:var(--leaf)}
#scroller{transition:transform 1.1s ease-in-out}
#progress{position:absolute;top:14px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:5}
.dot{width:22px;height:22px;border-radius:50% 0 50% 0;background:#ffffff99;border:3px solid var(--leaf-dark);transition:background .3s,transform .3s}
.dot.done{background:var(--leaf-light);transform:rotate(45deg) scale(1.1)}
#sofia{position:absolute;left:4%;bottom:9%;width:min(30vw,230px);z-index:3;animation:bob 2.4s ease-in-out infinite}
#sofia.walk{animation:walk .35s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes walk{50%{transform:translateY(-14px) rotate(-3deg)}}
#spot{position:absolute;right:6%;bottom:12%;width:min(48vw,400px);aspect-ratio:1/1;max-width:100%;z-index:2;
  border:0;background:none;padding:0;cursor:pointer}
#spot:focus-visible{outline:5px dashed var(--sun);outline-offset:6px;border-radius:30px}
#animal{position:absolute;left:12%;right:12%;bottom:22%;transform:translateY(60%) scale(.4);opacity:0;
  transition:transform .6s cubic-bezier(.3,1.6,.5,1),opacity .3s}
#spot.open #animal{transform:translateY(-8%) scale(1);opacity:1}
#spot.open.talk #animal{animation:wiggle .5s ease-in-out 3}
@keyframes wiggle{25%{rotate:-6deg}75%{rotate:6deg}}
#bush{position:absolute;inset:auto 0 0 0;transition:transform .4s}
#spot:not(.open) #bush{animation:shake 1.6s ease-in-out infinite}
#spot.open #bush{transform:translateY(18%)}
@keyframes shake{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-3deg)}82%{transform:rotate(3deg)}88%{transform:rotate(-2deg)}}
#hint{position:absolute;right:calc(6% + min(24vw,200px) - 34px);bottom:calc(12% + min(36vw,300px));z-index:4;
  width:68px;height:68px;animation:tap 1.2s ease-in-out infinite;pointer-events:none}
@keyframes tap{50%{transform:translateY(12px) scale(.92)}}
#card{position:absolute;top:56px;left:50%;transform:translate(-50%,-30px);opacity:0;z-index:6;
  background:var(--card);border:4px solid var(--leaf-dark);border-radius:26px;padding:12px 26px;
  text-align:center;transition:.4s;max-width:calc(100% - 32px);pointer-events:none}
#card.show{opacity:1;transform:translate(-50%,0)}
#card .ru{font-size:clamp(30px,6vw,52px);font-weight:900;line-height:1.1}
#card .lv{font-size:clamp(22px,4.4vw,38px);font-weight:700;color:var(--leaf)}
#card .snd{font-size:clamp(18px,3.4vw,28px);color:var(--pink);font-weight:900;margin-top:2px}
.big{position:absolute;z-index:7;border:0;cursor:pointer;font-family:var(--display);font-weight:900;color:#fff;
  background:var(--pink);box-shadow:0 8px 0 #b83b68;border-radius:999px;display:flex;align-items:center;gap:12px;justify-content:center;transition:transform .1s}
.big:active{transform:translateY(6px);box-shadow:0 2px 0 #b83b68}
.big:focus-visible{outline:5px solid var(--sun);outline-offset:4px}
#next{right:max(20px,env(safe-area-inset-right,0px));bottom:20px;padding:14px 30px;font-size:clamp(22px,4vw,32px)}
#next svg{width:40px;height:40px}
#overlay{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;
  background:#1f6b43e6;color:#fff;text-align:center;padding:24px}
#overlay h1{margin:0;font-size:clamp(40px,8vw,76px);font-weight:900;line-height:1;text-wrap:balance}
#overlay p{margin:0;font-size:clamp(20px,3.6vw,30px);font-weight:700;color:#d8f5dc}
#overlay .big{position:static;width:min(46vw,200px);aspect-ratio:1;max-width:100%}
#overlay .big svg{width:46%;height:46%}
#overlay .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
#overlay .mini{width:84px;height:84px}
.star{position:absolute;width:40px;height:40px;z-index:9;pointer-events:none;animation:fly 1.6s ease-out forwards}
@keyframes fly{from{transform:translate(0,0) scale(.3) rotate(0);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(240deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
@media (max-height:520px){#card{top:44px;padding:6px 18px}#sofia{width:min(22vw,170px)}}
</style>

      <circle cx="200" cy="112" r="96" fill="#3fa36a"/><circle cx="140" cy="176" r="60" fill="#5fbf7f"/><circle cx="270" cy="178" r="58" fill="#5fbf7f"/>
      <circle cx="118" cy="104" r="10" fill="#f06292"/><circle cx="262" cy="70" r="10" fill="#ffd25a"/><circle cx="300" cy="140" r="9" fill="#f06292"/><circle cx="170" cy="60" r="8" fill="#fff"/>
    </svg>

  <svg id="hint" viewBox="0 0 64 64" aria-hidden="true"><path d="M24 8a5 5 0 0 1 10 0v20l14 3a6 6 0 0 1 5 7l-3 16a6 6 0 0 1-6 5H28a6 6 0 0 1-5-3L12 38a4 4 0 0 1 6-5l6 5z" fill="#fff" stroke="#24352b" stroke-width="3" stroke-linejoin="round"/></svg>

  <button id="next" class="big" hidden aria-label="Дальше"><span>Дальше</span><svg viewBox="0 0 40 40"><path d="M8 20h22M20 9l11 11-11 11" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

  <div id="overlay">
    <h1>Соня в джунглях</h1>
    <p>Sofija džungļos</p>
    <button class="big" id="play" aria-label="Играть"><svg viewBox="0 0 40 40"><path d="M12 7l22 13-22 13z" fill="#fff"/></svg></button>
  </div>
</div>

<script>
const A = s => `<svg viewBox="0 0 200 200">${s}</svg>`;
const animals = [
 {ru:"Обезьяна", lv:"Pērtiķis", snd:"У-у-а-а!", sound:"monkey", svg:A(`
  <ellipse cx="100" cy="160" rx="48" ry="40" fill="#8a5a3b"/>
  <circle cx="44" cy="88" r="22" fill="#8a5a3b"/><circle cx="156" cy="88" r="22" fill="#8a5a3b"/>
  <circle cx="44" cy="88" r="12" fill="#e8c39e"/><circle cx="156" cy="88" r="12" fill="#e8c39e"/>
  <circle cx="100" cy="86" r="56" fill="#8a5a3b"/>
  <path d="M60 96 Q60 60 86 64 Q100 74 114 64 Q140 60 140 96 Q140 132 100 134 Q60 132 60 96Z" fill="#e8c39e"/>
  <circle cx="84" cy="88" r="8" fill="#24352b"/><circle cx="116" cy="88" r="8" fill="#24352b"/>
  <circle cx="86" cy="85" r="3" fill="#fff"/><circle cx="118" cy="85" r="3" fill="#fff"/>
  <path d="M82 112 Q100 126 118 112" fill="none" stroke="#24352b" stroke-width="5" stroke-linecap="round"/>`)},
 {ru:"Слон", lv:"Zilonis", snd:"Ту-ру-ру!", sound:"elephant", svg:A(`
  <path d="M30 70 Q8 110 40 140 Q60 150 70 120Z" fill="#a3aebb"/><path d="M170 70 Q192 110 160 140 Q140 150 130 120Z" fill="#a3aebb"/>
  <ellipse cx="100" cy="92" rx="62" ry="58" fill="#b9c3cf"/>
  <path d="M86 120 Q84 170 60 176 Q50 178 52 168 Q70 160 72 124Z" fill="#b9c3cf"/>
  <path d="M86 120 Q84 170 60 176" fill="none" stroke="#8d98a6" stroke-width="3"/>
  <circle cx="78" cy="86" r="8" fill="#24352b"/><circle cx="122" cy="86" r="8" fill="#24352b"/>
  <circle cx="80" cy="83" r="3" fill="#fff"/><circle cx="124" cy="83" r="3" fill="#fff"/>
  <circle cx="64" cy="106" r="9" fill="#f8a5b8" opacity=".7"/><circle cx="136" cy="106" r="9" fill="#f8a5b8" opacity=".7"/>`)},
 {ru:"Лев", lv:"Lauva", snd:"Р-р-р!", sound:"lion", svg:A(`
  <g fill="#d9792b">${Array.from({length:12},(_, i)=>{const a=i*Math.PI/6;return `<circle cx="${100+62*Math.cos(a)}" cy="${96+62*Math.sin(a)}" r="28"/>`}).join("")}</g>
  <circle cx="100" cy="96" r="62" fill="#d9792b"/>
  <circle cx="100" cy="98" r="48" fill="#f4c45a"/>
  <circle cx="82" cy="90" r="7" fill="#24352b"/><circle cx="118" cy="90" r="7" fill="#24352b"/>
  <circle cx="84" cy="87" r="2.5" fill="#fff"/><circle cx="120" cy="87" r="2.5" fill="#fff"/>
  <path d="M90 106 L110 106 L100 118Z" fill="#7a4a2a"/>
  <path d="M100 118 Q90 128 82 122 M100 118 Q110 128 118 122" fill="none" stroke="#7a4a2a" stroke-width="4" stroke-linecap="round"/>`)},
 {ru:"Попугай", lv:"Papagailis", snd:"Кар-кар!", sound:"parrot", svg:A(`
  <path d="M100 150 L84 196 L100 190 L116 196Z" fill="#3c7dd9"/>
  <ellipse cx="100" cy="116" rx="44" ry="56" fill="#e2453c"/>
  <path d="M70 110 Q60 160 100 168 Q78 140 92 110Z" fill="#3c7dd9"/><path d="M130 110 Q140 160 100 168 Q122 140 108 110Z" fill="#ffd25a"/>
  <circle cx="100" cy="64" r="38" fill="#e2453c"/>
  <circle cx="86" cy="58" r="13" fill="#fff"/><circle cx="114" cy="58" r="13" fill="#fff"/>
  <circle cx="88" cy="58" r="6" fill="#24352b"/><circle cx="112" cy="58" r="6" fill="#24352b"/>
  <path d="M92 72 Q100 66 108 72 Q108 92 100 98 Q92 92 92 72Z" fill="#f4b23a"/>`)},
 {ru:"Змея", lv:"Čūska", snd:"Ш-ш-ш!", sound:"snake", svg:A(`
  <path d="M30 170 Q60 140 100 160 Q150 184 160 150 Q168 120 120 118 Q70 116 76 86" fill="none" stroke="#4caf50" stroke-width="30" stroke-linecap="round"/>
  <path d="M30 170 Q60 140 100 160 Q150 184 160 150 Q168 120 120 118 Q70 116 76 86" fill="none" stroke="#ffd25a" stroke-width="6" stroke-dasharray="6 18" stroke-linecap="round"/>
  <ellipse cx="80" cy="68" rx="34" ry="28" fill="#4caf50"/>
  <circle cx="68" cy="60" r="7" fill="#24352b"/><circle cx="94" cy="60" r="7" fill="#24352b"/>
  <circle cx="70" cy="58" r="2.5" fill="#fff"/><circle cx="96" cy="58" r="2.5" fill="#fff"/>
  <path d="M80 92 L80 106 L74 114 M80 106 L86 114" fill="none" stroke="#e2453c" stroke-width="4" stroke-linecap="round"/>`)},
 {ru:"Лягушка", lv:"Varde", snd:"Ква-ква!", sound:"frog", svg:A(`
  <ellipse cx="100" cy="150" rx="70" ry="40" fill="#4caf50"/>
  <ellipse cx="100" cy="112" rx="72" ry="50" fill="#66c26a"/>
  <circle cx="64" cy="70" r="26" fill="#66c26a"/><circle cx="136" cy="70" r="26" fill="#66c26a"/>
  <circle cx="64" cy="68" r="16" fill="#fff"/><circle cx="136" cy="68" r="16" fill="#fff"/>
  <circle cx="66" cy="70" r="8" fill="#24352b"/><circle cx="134" cy="70" r="8" fill="#24352b"/>
  <path d="M58 118 Q100 150 142 118" fill="none" stroke="#24352b" stroke-width="5" stroke-linecap="round"/>
  <circle cx="50" cy="118" r="10" fill="#f8a5b8" opacity=".7"/><circle cx="150" cy="118" r="10" fill="#f8a5b8" opacity=".7"/>`)}
];

const $ = id => document.getElementById(id);
const spot=$("spot"), animalEl=$("animal"), card=$("card"), next=$("next"), hint=$("hint"), overlay=$("overlay"), scroller=$("scroller"), sofia=$("sofia");
let idx=0, opened=false, busy=false, ctx=null, scrollX=0;

animals.forEach(()=>{const d=document.createElement("div");d.className="dot";$("progress").appendChild(d)});
function vines(){ // decorative vines, laid along a wide strip that scrolls
  for(let i=0;i<40;i++){const v=document.createElement("div");v.className="vine";
    v.style.left=(i*13+Math.random()*6)+"vw";v.style.height=(18+Math.random()*28)+"vh";scroller.appendChild(v)}
}
vines();

/* ---------- sounds (Web Audio, synthesized) ---------- */
function ac(){ if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)(); if(ctx.state==="suspended") ctx.resume(); return ctx }
function tone(type,f0,f1,t0,dur,vol=.3,filt){
  const c=ac(),o=c.createOscillator(),g=c.createGain(); o.type=type;
  o.frequency.setValueAtTime(f0,t0); o.frequency.exponentialRampToValueAtTime(f1,t0+dur);
  g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+.03); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  let n=o; if(filt){const f=c.createBiquadFilter();f.type=filt.type;f.frequency.value=filt.f;f.Q.value=filt.q||1;o.connect(f);n=f}
  n.connect(g).connect(c.destination); o.start(t0); o.stop(t0+dur+.05); return o;
}
function noise(t0,dur,vol,type,f,q=1,sweepTo){
  const c=ac(),b=c.createBuffer(1,c.sampleRate*dur,c.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  const s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain(); s.buffer=b; fl.type=type; fl.frequency.setValueAtTime(f,t0); fl.Q.value=q;
  if(sweepTo) fl.frequency.exponentialRampToValueAtTime(sweepTo,t0+dur);
  g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+.08); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  s.connect(fl).connect(g).connect(c.destination); s.start(t0);
}
const sounds={
  monkey(){const t=ac().currentTime;[0,.22,.44].forEach(d=>tone("triangle",420,780,t+d,.18,.35));tone("sawtooth",900,500,t+.7,.35,.25,{type:"lowpass",f:1800});tone("sawtooth",950,520,t+1.1,.35,.25,{type:"lowpass",f:1800});return 1.5},
  elephant(){const t=ac().currentTime,o=tone("sawtooth",320,520,t,1.1,.35,{type:"bandpass",f:900,q:2});
    const lfo=ac().createOscillator(),lg=ac().createGain();lfo.frequency.value=9;lg.gain.value=25;lfo.connect(lg).connect(o.frequency);lfo.start(t);lfo.stop(t+1.1);return 1.2},
  lion(){const t=ac().currentTime;tone("sawtooth",140,70,t,1.3,.4,{type:"lowpass",f:500});noise(t,1.3,.35,"lowpass",700,1,200);return 1.4},
  parrot(){const t=ac().currentTime;[0,.32].forEach(d=>{tone("sawtooth",1300,2000,t+d,.12,.25,{type:"bandpass",f:1800,q:3});tone("square",2000,1100,t+d+.12,.12,.15,{type:"bandpass",f:1600,q:3})});return .8},
  snake(){const t=ac().currentTime;noise(t,1.4,.3,"highpass",3500,.7);return 1.4},
  frog(){const t=ac().currentTime;[0,.45].forEach(d=>{tone("square",180,120,t+d,.22,.3,{type:"lowpass",f:900});tone("square",240,160,t+d+.08,.14,.18,{type:"lowpass",f:900})});return 1},
  yay(){const t=ac().currentTime;[523,659,784,1047].forEach((f,i)=>tone("triangle",f,f,t+i*.12,.3,.25));return .7},
  pop(){const t=ac().currentTime;tone("sine",300,900,t,.12,.3);return .2}
};

/* ---------- speech (device voices) ---------- */
let voices=[]; const loadV=()=>voices=speechSynthesis.getVoices(); if("speechSynthesis" in window){loadV();speechSynthesis.onvoiceschanged=loadV}
function say(text,lang){return new Promise(res=>{
  if(!("speechSynthesis" in window)) return res();
  const v=voices.find(v=>v.lang.toLowerCase().startsWith(lang)); if(!v && lang!=="ru") return res();
  const u=new SpeechSynthesisUtterance(text); u.lang=lang==="ru"?"ru-RU":"lv-LV"; if(v) u.voice=v; u.rate=.8; u.pitch=1.15;
  u.onend=u.onerror=()=>res(); speechSynthesis.speak(u); setTimeout(res,4000);
})}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- game flow ---------- */
function setAnimal(){const a=animals[idx];animalEl.innerHTML=a.svg;card.querySelector(".ru").textContent=a.ru;card.querySelector(".lv").textContent=a.lv;card.querySelector(".snd").textContent=a.snd}
async function perform(){
  if(busy) return; busy=true; const a=animals[idx];
  spot.classList.add("talk"); const d=sounds[a.sound](); await wait(d*1000+200); spot.classList.remove("talk");
  await say(a.ru,"ru"); await wait(250); await say(a.lv,"lv");
  busy=false;
}
spot.addEventListener("click",async()=>{
  ac();
  if(!opened){opened=true;hint.hidden=true;sounds.pop();spot.classList.add("open");card.classList.add("show");
    document.querySelectorAll(".dot")[idx].classList.add("done");
    await wait(500); await perform(); next.hidden=false; return}
  perform();
});
next.addEventListener("click",async()=>{
  if(busy) return; next.hidden=true; card.classList.remove("show"); spot.classList.remove("open"); opened=false;
  if(idx===animals.length-1){finale();return}
  busy=true; sofia.classList.add("walk"); scrollX-=60; scroller.style.transform=`translateX(${scrollX}vw)`;
  spot.style.transition="transform 1.1s ease-in-out"; spot.style.transform="translateX(120vw)";
  await wait(500); idx++; setAnimal(); spot.style.transition="none"; spot.style.transform="translateX(120vw)";
  requestAnimationFrame(()=>{spot.style.transition="transform .8s ease-out";spot.style.transform="translateX(0)"});
  await wait(900); sofia.classList.remove("walk"); hint.hidden=false; busy=false;
});
function stars(){for(let i=0;i<24;i++){const s=document.createElementNS("http://www.w3.org/2000/svg","svg");s.setAttribute("viewBox","0 0 24 24");s.classList.add("star");
  s.innerHTML='<path d="M12 2l3 7 7 .6-5.4 4.7 1.7 7.2L12 17.8 5.7 21.5l1.7-7.2L2 9.6 9 9z" fill="'+["#ffd25a","#f06292","#fff","#5fbf7f"][i%4]+'"/>';
  s.style.left="50%";s.style.top="45%";s.style.setProperty("--dx",(Math.random()*90-45)+"vw");s.style.setProperty("--dy",(Math.random()*80-40)+"vh");
  $("stage").appendChild(s);setTimeout(()=>s.remove(),1700)}}
function finale(){
  sounds.yay(); stars(); overlay.hidden=false;
  overlay.innerHTML=`<h1>Молодец, Соня!</h1><p>Malacis, Sofija!</p>
   <div class="row">${animals.map((a,i)=>`<button class="mini" data-i="${i}" aria-label="${a.ru}" style="border:0;background:#fffdf6;border-radius:24px;padding:6px;cursor:pointer">${a.svg}</button>`).join("")}</div>
   <button class="big" id="again" aria-label="Ещё раз"><svg viewBox="0 0 40 40"><path d="M30 14a12 12 0 1 0 2 10" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M32 5v10H22" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`;
  say("Молодец, Соня!","ru").then(()=>say("Malacis, Sofija!","lv"));
  overlay.querySelectorAll(".mini").forEach(b=>b.onclick=async()=>{const a=animals[+b.dataset.i];sounds[a.sound]();await wait(900);await say(a.ru,"ru");say(a.lv,"lv")});
  $("again").onclick=()=>{idx=0;document.querySelectorAll(".dot").forEach(d=>d.classList.remove("done"));setAnimal();overlay.hidden=true;hint.hidden=false};
}
$("play").addEventListener("click",()=>{ac();sounds.pop();overlay.hidden=true;say("Привет! Кто живёт в джунглях?","ru")});
setAnimal();
</script>
</body></html>
