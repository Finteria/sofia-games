<title>Игры Софии · Sofijas spēles</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap">
<style>
:root{--bg:#bfe9d6;--ink:#24352b;--leaf:#2f8f5b;--card:#fffdf6;--pink:#f06292;color-scheme:light}
html{height:100%}
body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center;
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;box-sizing:border-box}
/* Russian and Latvian always share one size and weight */
h1{margin:0;font-size:clamp(34px,6.5vw,60px);font-weight:900;line-height:1.1;display:flex;flex-direction:column;gap:.15em}
/* wide screens: the title on one line, so three rows of cards fit without scrolling */
@media (min-aspect-ratio:1/1) and (min-width:700px){h1{flex-direction:row;gap:.3em;font-size:clamp(30px,4.6vw,50px)}h1 span+span::before{content:"· ";opacity:.5}}
/* six cards a row on an iPad in landscape, four upright, two on a phone; a short last row sits in the middle */
.games{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;max-width:calc(5*156px + 4*16px)}
@media (max-width:879px){.games{max-width:calc(4*156px + 3*16px)}}
@media (max-width:640px){.games{max-width:calc(2*min(42vw,156px) + 16px)}}
a.game{display:flex;flex-direction:column;align-items:center;gap:6px;width:min(42vw,156px);padding:14px 6px;box-sizing:border-box;border-radius:32px;
  background:var(--card);border:5px solid var(--leaf);color:var(--ink);text-decoration:none;font-size:28px;font-weight:900}
a.game:active{transform:scale(.96)}
a.game svg{width:66%;height:auto}
a.game span{font-size:23px;line-height:1.15}
/* a wide iPad on its side: six a row, so three rows still fit */
@media (min-aspect-ratio:1/1) and (min-width:960px){:root{--cw:min(156px,calc((100vw - 112px) / 6))}.games{max-width:calc(6*var(--cw) + 5*16px)}a.game{width:var(--cw)}}
</style>
<style>/* no zooming by accident: no double-tap zoom on anything (own touch-action rules still win) */
*{touch-action:manipulation}</style>
<script>/* Safari on the iPad still zooms on a pinch, so stop the pinch gesture */
["gesturestart","gesturechange"].forEach(t => document.addEventListener(t, e => e.preventDefault(), {passive: false}));</script>
</head>
