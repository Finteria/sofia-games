<html lang="ru">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Игры Софии · Sofijas spēles</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap">
<style>
:root{--bg:#bfe9d6;--ink:#24352b;--leaf:#2f8f5b;--card:#fffdf6;--pink:#f06292;color-scheme:light}
html{height:100%}
body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center;
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;box-sizing:border-box}
/* Russian and Latvian always share one size and weight */
h1{margin:0;font-size:clamp(34px,6.5vw,60px);font-weight:900;line-height:1.1;display:flex;flex-direction:column;gap:.15em}
/* four cards a row on an iPad, three or two on smaller screens; a short last row sits in the middle */
.games{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;max-width:calc(4*180px + 3*20px)}
@media (max-width:799px){.games{max-width:calc(3*180px + 2*20px)}}
@media (max-width:640px){.games{max-width:calc(2*min(42vw,180px) + 20px)}}
a.game{display:flex;flex-direction:column;align-items:center;gap:8px;width:min(42vw,180px);padding:16px 8px;box-sizing:border-box;border-radius:32px;
  background:var(--card);border:5px solid var(--leaf);color:var(--ink);text-decoration:none;font-size:28px;font-weight:900}
a.game:active{transform:scale(.96)}
a.game svg{width:70%;height:auto}
a.game span{font-size:26px;line-height:1.15}
</style>
</head>
