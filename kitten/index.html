<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kitten care · Котёнок · Kaķēns</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap">
<style>
/* layout: a cosy room; Sofia on the left, her kitten in the middle, the thing to use next (sponge, towel, bowl, ball, blanket, lamp)
   on a little shelf on the right. Steps: wash, rinse, dry, feed, play, bedtime. */
:root{
  --ink:#24352b; --card:#fffdf6; --pink:#f06292;
  --display:"Nunito","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
  --sh:min(56vh,480px,90vw); --sw:calc(var(--sh)*.4624); --sx:max(12px,3vw);
  --kw:min(54vh,36vw,440px); --pw:min(20vh,15vw,160px); --mw:84px;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:#d9f1f1;color:var(--ink);font-family:var(--display);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#stage{position:fixed;inset:0;overflow:hidden;overflow:clip}
#room{position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(90deg,#ffffff70 2px,transparent 2px) 0 0/64px 64px,linear-gradient(#ffffff70 2px,transparent 2px) 0 0/64px 64px,#cdeeee}
#room::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16%;border-top:10px solid #b9824e;background:repeating-linear-gradient(90deg,#dba56d 0 90px,#cc955c 90px 94px)}
#rug{position:absolute;bottom:4%;height:9%;border-radius:50%;background:radial-gradient(ellipse,#b3e5fc 0 45%,#81d4fa 46% 56%,#b3e5fc 57%);pointer-events:none}
#night{position:absolute;inset:0;z-index:8;pointer-events:none;opacity:0;transition:opacity 1.6s;
  background:radial-gradient(circle at 85% 14%,#fff8d6 0 30px,transparent 32px),radial-gradient(circle at 20% 20%,#fff 0 2px,transparent 3px) 0 0/110px 90px,
  radial-gradient(circle at 60% 70%,#fff 0 1.5px,transparent 2.5px) 0 0/150px 120px,#0b1340d0}
#night.on{opacity:1}
#progress{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:9;pointer-events:none}
.dot{width:38px;height:38px;border-radius:50%;background:#ffffffaa;border:3px solid #8bbcbc;display:flex;align-items:center;justify-content:center;font-size:21px;transition:transform .3s}
.dot.done{background:#fff;border-color:#2f8f5b;transform:scale(1.15)}
.dot.now{border-color:#f06292;transform:scale(1.15)}
@media (max-width:500px){#progress{gap:5px;padding-left:60px}.dot{width:30px;height:30px;font-size:16px}}

#sofia{position:absolute;left:var(--sx);bottom:5%;height:var(--sh);aspect-ratio:800/1730;z-index:3;cursor:pointer;
  transform-origin:50% 100%;animation:bob 2.4s ease-in-out infinite}
#sofia svg{display:block;width:100%;height:100%;overflow:visible}
#sofia svg *{transform-box:view-box}
#sofia .ink{stroke:#1b1717;stroke-linecap:round;stroke-linejoin:round}
#sofia .skin{fill:#ffe3cf}
#sofia .hair{fill:#3b2a20}
#sofia .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
#sofia .mouth.open{opacity:0}
#sofia.talk .mouth.open{animation:flap .3s steps(1,end) infinite}
#sofia.talk .mouth.shut{animation:flap .3s steps(1,end) infinite -.15s}
#sofia .head{transform-origin:400px 870px}
#sofia .arm.l{transform-origin:262px 955px;animation:sway 2.4s ease-in-out infinite}
#sofia .arm.r{transform-origin:538px 955px;animation:sway 2.4s ease-in-out infinite reverse}
#sofia .leg.l{transform-origin:335px 1390px}
#sofia .leg.r{transform-origin:465px 1390px}
#sofia.walk{animation:stride .6s ease-in-out infinite}
#sofia.walk .leg.l{animation:stepL .6s ease-in-out infinite}
#sofia.walk .leg.r{animation:stepR .6s ease-in-out infinite}
#sofia.walk .arm.l{animation:swingL .6s ease-in-out infinite}
#sofia.walk .arm.r{animation:swingR .6s ease-in-out infinite}
#sofia.walk .head{animation:nod .6s ease-in-out infinite}
#sofia.talk .head{animation:chat .32s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes flap{0%{opacity:1}50%{opacity:0}}
@keyframes sway{50%{transform:rotate(4deg)}}
@keyframes stride{0%,50%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-3%) rotate(-2deg)}75%{transform:translateY(-3%) rotate(2deg)}}
@keyframes stepL{0%,50%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-60px) rotate(7deg)}}
@keyframes stepR{0%,50%,100%{transform:translateY(0) rotate(0)}75%{transform:translateY(-60px) rotate(-7deg)}}
@keyframes swingL{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(10deg)}}
@keyframes swingR{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(16deg)}}
@keyframes nod{0%,50%,100%{transform:rotate(0)}25%{transform:rotate(3deg)}75%{transform:rotate(-3deg)}}
@keyframes chat{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(3deg) scale(1.03)}}

/* the kitten */
#scene{position:absolute;left:calc(var(--sx) + var(--sw) + 2vw);right:calc(var(--pw) + 6vw);top:14%;bottom:5%;z-index:4;display:flex;align-items:flex-end;justify-content:center}
#kit{position:relative;width:var(--kw);aspect-ratio:300/330;touch-action:none;cursor:pointer}
#kit>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#kit .head{transform-box:view-box;transform-origin:150px 190px}
#kit .tail{transform-box:view-box;transform-origin:215px 280px;animation:tail 2.4s ease-in-out infinite}
@keyframes tail{50%{transform:rotate(10deg)}}
#kit .shut,#kit .sadm,#kit .brow,#kit .om{display:none}
#kit.sad .sadm,#kit.sad .brow{display:inline}#kit.sad .happy{display:none}
#kit.sleep .open{display:none}#kit.sleep .shut{display:inline}
#kit.eat .happy{display:none}#kit.eat .om{display:inline}
#kit.eat .head{animation:eat .4s ease-in-out infinite}
@keyframes eat{50%{transform:rotate(4deg) translateY(8px)}}
#kit.happy-jump{animation:kjump .6s ease-out}
@keyframes kjump{40%{translate:0 -14%}}
#kit.shake .head{animation:kshake .25s ease-in-out 4}
@keyframes kshake{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
#kit.breathe>svg{animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.02,.98)}}
.bubble{position:absolute;z-index:3;border-radius:50%;pointer-events:none;translate:-50% -50%;
  background:radial-gradient(circle at 32% 30%,#fff 0 12%,#ffffff55 14%,#cfe9ffaa 60%,#9ad0ff 100%);box-shadow:inset 0 0 0 2px #ffffffcc;animation:bpop .3s ease-out}
@keyframes bpop{from{scale:0}}
.bubble.gone{transition:opacity .4s,translate .6s;opacity:0;translate:-50% 60%}
#water{position:absolute;left:-6%;right:-6%;top:-20%;bottom:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .3s;
  background:repeating-linear-gradient(100deg,transparent 0 16px,#9ad0ffcc 16px 19px,transparent 19px 34px);background-size:auto 200%;animation:shower .35s linear infinite}
#water.on{opacity:1}
@keyframes shower{to{background-position:-10px 60px}}
#shower{position:absolute;left:50%;top:-34%;width:44%;translate:-50% 0;z-index:5;border:0;padding:0;background:none;cursor:pointer}
#shower svg{width:100%;height:auto;display:block}
#shower.glow svg{filter:drop-shadow(0 0 12px #fff) drop-shadow(0 0 6px #fff);animation:help .9s ease-in-out infinite}
.zzz{position:absolute;z-index:9;font-size:42px;font-weight:900;color:#fff;pointer-events:none;animation:zzz 2.6s ease-out forwards}
@keyframes zzz{from{transform:translate(0,0) scale(.5);opacity:0}20%{opacity:1}to{transform:translate(50px,-150px) scale(1.3);opacity:0}}

/* the shelf with the thing to use next */
#props{position:absolute;right:3vw;bottom:12%;width:var(--pw);height:var(--pw);z-index:6;border-radius:24px;background:#ffffffb0;box-shadow:inset 0 -12px 0 #0000000d,0 6px 0 #0001}
.tool{position:absolute;inset:6%;border:0;padding:0;background:none;cursor:grab;display:flex;align-items:center;justify-content:center;touch-action:none;font-size:calc(var(--pw)*.62);line-height:1}
.tool svg{width:100%;height:100%;pointer-events:none}
.tool .t{display:flex;width:100%;height:100%;align-items:center;justify-content:center;pointer-events:none}
.tool.glow .t{animation:help .9s ease-in-out infinite;filter:drop-shadow(0 0 10px #fff) drop-shadow(0 0 5px #fff)}
@keyframes help{50%{scale:1.12}}
.tool.away .t{opacity:0}
#rubber{position:fixed;z-index:20;width:calc(var(--pw)*.8);height:calc(var(--pw)*.8);translate:-50% -50%;pointer-events:none;font-size:calc(var(--pw)*.6);line-height:1;
  display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 8px 6px #0003)}
#rubber svg{width:100%;height:100%}
.flying{position:fixed;z-index:20;pointer-events:none;translate:-50% -50%;display:flex;align-items:center;justify-content:center;line-height:1}
.flying svg{width:100%;height:100%}

.big{position:absolute;z-index:9;border:0;cursor:pointer;font-family:var(--display);font-weight:900;color:#fff;
  background:var(--pink);box-shadow:0 8px 0 #b83b68;border-radius:999px;display:flex;align-items:center;gap:12px;justify-content:center;transition:transform .1s}
.big:active{transform:translateY(6px);box-shadow:0 2px 0 #b83b68}
#repeat{left:max(8px,calc(var(--sx) - var(--mw) * .3));bottom:calc(5% + 10px);width:var(--mw);height:var(--mw);padding:0}
#repeat svg{width:46px;height:46px}
.corner{position:absolute;top:max(14px,env(safe-area-inset-top,0px));width:60px;height:60px;border-radius:50%;z-index:13;
  background:#ffffff55;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.corner svg{width:34px;height:34px}
.home{left:max(14px,env(safe-area-inset-left,0px))}
#stage>.home{background:#5aa5a588}

#overlay{position:absolute;inset:0;z-index:12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  background:#2f9e9ef2;color:#fff;text-align:center;padding:24px;overflow-y:auto}
#overlay>h1{margin-top:auto!important}
#overlay>:last-child{margin-bottom:auto}
#overlay h1{margin:0;font-size:clamp(40px,7.5vw,80px);font-weight:900;line-height:1.05;text-shadow:0 4px 0 #0003}
#overlay .sub{margin:-8px 0 0;font-size:clamp(20px,3.4vw,28px);font-weight:900;opacity:.92}
.langs,.kits{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.kits{max-width:calc(2 * min(38vw,190px) + 18px)}
@media (min-aspect-ratio:1/1){.kits{max-width:none}}
.go{width:min(40vw,220px);padding:16px 10px 14px;border:0;border-radius:32px;background:var(--card);cursor:pointer;font-family:var(--display);
  box-shadow:0 8px 0 #0003;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);transition:transform .1s}
.go:active{transform:translateY(6px);box-shadow:0 2px 0 #0003}
.go .e{font-size:clamp(44px,7vw,64px);line-height:1.1;white-space:nowrap}
.go .name{font-size:clamp(20px,3vw,26px);font-weight:900}
.go svg{width:48px;height:48px}
.go.last{outline:5px solid #ffd25a;outline-offset:3px}
.pick{width:min(38vw,190px);aspect-ratio:1;border:0;border-radius:36px;background:var(--card);cursor:pointer;box-shadow:0 8px 0 #0003;padding:10px}
.pick svg{width:100%;height:100%}
.pick:active{transform:translateY(6px);box-shadow:0 2px 0 #0003}

/* the big "yes!" */
.star{position:absolute;width:40px;height:40px;z-index:10;pointer-events:none;animation:fly 1.6s ease-out forwards}
@keyframes fly{from{transform:translate(0,0) scale(.3) rotate(0);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(240deg);opacity:0}}
.bigstar{position:absolute;width:min(42vmin,280px);height:min(42vmin,280px);translate:-50% -50%;z-index:10;pointer-events:none;animation:bigstar 1.1s ease-out forwards}
@keyframes bigstar{0%{scale:0;rotate:-60deg;opacity:1}40%{scale:1.15;rotate:8deg;opacity:1}100%{scale:1.6;rotate:0deg;opacity:0}}
.confetti{position:absolute;top:-5vh;width:13px;height:20px;border-radius:3px;z-index:10;pointer-events:none;animation:fall var(--t) cubic-bezier(.25,.6,.6,1) var(--dl) forwards}
@keyframes fall{to{transform:translate(var(--dx),112vh) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
/* tall screens: the kitten in the middle, Sofia and the shelf below */
@media (orientation:portrait){
  :root{--sh:min(32vh,380px);--kw:min(40vh,72vw,440px);--pw:min(16vh,26vw,160px)}
  #scene{left:3vw;right:3vw;top:16%;bottom:calc(5% + var(--sh)*.62)}
  #props{bottom:6%}
}
@media (max-height:520px){:root{--sh:66vh;--kw:min(58vh,30vw);--pw:min(28vh,14vw);--mw:64px}#repeat svg{width:34px;height:34px}#scene{top:18%}}
</style>
<style>/* no zooming by accident: no double-tap zoom on anything (own touch-action rules still win) */
*{touch-action:manipulation}</style>
<script>/* Safari on the iPad still zooms on a pinch, so stop the pinch gesture */
["gesturestart","gesturechange"].forEach(t => document.addEventListener(t, e => e.preventDefault(), {passive: false}));</script>
</head>
<body>
<div id="stage">
  <div id="room"></div><div id="rug"></div>
  <div id="progress"></div>
  <div id="sofia" role="img" aria-label="Sofia: tap to hear it again">
    <svg viewBox="0 0 800 1730" aria-hidden="true">
      <defs>
        <g id="leg">
          <path class="ink" d="M335 1380 L331 1640" fill="none" stroke-width="68"/>
          <path d="M335 1380 L331 1640" stroke="#ffe3cf" stroke-width="50" stroke-linecap="round"/>
          <path d="M331 1590 L331 1640" stroke="#fff" stroke-width="50"/>
          <path d="M305 1592 H357" stroke="#f06292" stroke-width="10" stroke-linecap="round"/>
          <ellipse class="ink" cx="318" cy="1672" rx="60" ry="34" fill="#d6453d" stroke-width="9"/>
          <ellipse cx="300" cy="1660" rx="16" ry="8" fill="#fff" opacity=".5"/>
        </g>
        <g id="arm">
          <path class="ink" d="M262 965 Q232 1085 218 1200" fill="none" stroke-width="64"/>
          <circle cx="216" cy="1222" r="34" fill="#1b1717"/>
          <path d="M262 965 Q232 1085 218 1200" fill="none" stroke="#ffe3cf" stroke-width="46" stroke-linecap="round"/>
          <circle class="skin" cx="216" cy="1222" r="25"/>
          <ellipse class="ink" cx="266" cy="955" rx="58" ry="48" fill="#f7a8c4" stroke-width="9"/>
        </g>
      </defs>
      <g class="leg l"><use href="#leg"/></g>
      <g class="leg r"><use href="#leg" transform="translate(800 0) scale(-1 1)"/></g>
      <path class="skin ink" d="M352 820 L350 925 Q400 950 450 925 L448 820Z" stroke-width="8"/>
      <path class="ink" d="M305 900 Q400 945 495 900 L535 918 Q565 990 562 1080 L640 1420 Q400 1478 160 1420 L238 1080 Q235 990 265 918 Z" fill="#f7a8c4" stroke-width="9"/>
      <path d="M190 1385 Q400 1440 610 1385" fill="none" stroke="#f06292" stroke-width="12" stroke-linecap="round" stroke-dasharray="2 34"/>
      <g fill="#fff" opacity=".8"><circle cx="330" cy="1060" r="13"/><circle cx="450" cy="1110" r="13"/><circle cx="390" cy="1210" r="13"/><circle cx="280" cy="1270" r="13"/><circle cx="510" cy="1260" r="13"/><circle cx="400" cy="1340" r="13"/><circle cx="240" cy="1370" r="12"/><circle cx="560" cy="1370" r="12"/></g>
      <path class="ink" d="M308 902 Q322 980 400 950 L400 930 Q352 936 308 902Z M492 902 Q478 980 400 950 L400 930 Q448 936 492 902Z" fill="#fff" stroke-width="7"/>
      <g class="arm l"><use href="#arm"/></g>
      <g class="arm r"><use href="#arm" transform="translate(800 0) scale(-1 1)"/></g>
      <g class="head"><g transform="rotate(-4 400 560)">
        <!-- cartoon Sofia after her portrait: round cheeks, top-knot curling right; Amélie-style bob with short blunt bangs -->
        <path class="hair ink" d="M118 600 C92 360 212 168 400 166 C588 168 708 360 682 600 L694 770 C698 812 650 822 616 800 L184 800 C150 822 102 812 106 770Z" stroke-width="9"/>
        <g class="tuft">
          <path class="hair ink" d="M448 230 C400 175 345 150 290 158 C345 118 425 140 472 212Z" stroke-width="9"/>
          <path class="hair ink" d="M450 225 C428 140 455 70 515 25 C512 95 512 160 490 228Z" stroke-width="9"/>
          <path class="hair ink" d="M462 228 C495 120 600 62 688 102 C712 150 680 196 648 170 C668 140 632 118 600 128 C555 145 525 185 500 240Z" stroke-width="9"/>
          <path d="M468 200 C470 140 485 95 508 60 M495 210 C530 145 590 112 650 115" fill="none" stroke="#6b4a36" stroke-width="6" stroke-linecap="round"/>
        </g>
        <path class="skin ink" d="M158 540 C158 360 270 280 400 280 C530 280 642 360 642 540 C642 700 610 795 530 842 C475 872 325 872 270 842 C190 795 158 700 158 540Z" stroke-width="9"/>
        <path d="M262 505 Q300 485 340 500 M462 508 Q502 490 542 506" fill="none" stroke="#3b2a20" stroke-width="10" stroke-linecap="round"/>
        <g class="eye"><ellipse cx="300" cy="575" rx="27" ry="33" fill="#1b1717"/><circle cx="290" cy="563" r="10" fill="#fff"/><circle cx="310" cy="590" r="4.5" fill="#fff"/></g>
        <g class="eye"><ellipse cx="500" cy="580" rx="27" ry="33" fill="#1b1717"/><circle cx="490" cy="568" r="10" fill="#fff"/><circle cx="510" cy="595" r="4.5" fill="#fff"/></g>
        <ellipse cx="252" cy="668" rx="46" ry="30" fill="#ff8fab" opacity=".45"/>
        <ellipse cx="548" cy="672" rx="46" ry="30" fill="#ff8fab" opacity=".45"/>
        <path d="M388 640 Q400 656 414 640" fill="none" stroke="#c98f7a" stroke-width="8" stroke-linecap="round"/>
        <path class="mouth shut" d="M345 705 Q400 752 455 705" fill="none" stroke="#1b1717" stroke-width="10" stroke-linecap="round"/>
        <g class="mouth open"><path d="M350 700 Q400 706 450 700 Q444 768 400 772 Q356 768 350 700Z" fill="#8e2a3a" stroke="#1b1717" stroke-width="8" stroke-linejoin="round"/><ellipse cx="400" cy="752" rx="26" ry="12" fill="#f28b9b"/></g>
        <path class="hair ink" d="M168 430 C142 560 146 700 172 795 C196 812 232 800 228 776 C210 690 206 560 222 440Z M632 430 C658 560 654 700 628 795 C604 812 568 800 572 776 C590 690 594 560 578 440Z" stroke-width="9"/>
        <path class="hair ink" d="M170 480 C150 320 265 208 400 208 C535 208 650 320 630 480 C560 458 480 452 400 454 C320 452 240 458 170 480Z" stroke-width="9"/>
        <path d="M250 300 C320 255 470 250 550 290 M300 452 L304 418 M400 450 L400 414 M500 452 L496 418 M196 560 L192 700 M604 560 L608 700" fill="none" stroke="#6b4a36" stroke-width="7" stroke-linecap="round"/>
        <path d="M470 215 L408 172 L414 262 Z M470 215 L536 178 L526 266 Z" fill="#f06292" stroke="#c2185b" stroke-width="6" stroke-linejoin="round"/>
        <circle cx="470" cy="217" r="21" fill="#e04a7f" stroke="#c2185b" stroke-width="6"/>
      </g></g>
    </svg>
  </div>
  <div id="scene"><div id="kit" hidden></div></div>
  <div id="props" hidden></div>
  <div id="night"></div>
  <button id="repeat" class="big" hidden aria-label="Say it again"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M6 15h7l9-8v26l-9-8H6z" fill="#fff"/><path d="M27 13a9 9 0 0 1 0 14M31 8a15 15 0 0 1 0 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/></svg></button>
  <a class="corner home" href="../index.html" aria-label="Menu"><svg viewBox="0 0 40 40"><path d="M6 19L20 7l14 12M11 16v16h18V16" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  <div id="overlay"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const stage=$("stage"), overlay=$("overlay"), sofia=$("sofia"), repeatBtn=$("repeat"), kit=$("kit"), props=$("props");
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const NS="http://www.w3.org/2000/svg";

/* ---------- the kitten: the cartoon cat from the music player, now sitting, with a tail; faces for sad, happy, eating, asleep ---------- */
const LOOK={
  ginger:{fur:"#f6a04d",belly:"#fbd2a6",line:"#a85a1c",stripe:"#d9782a",ear:"#ffc6cf",eye:"#3b2a20"},
  white:{fur:"#ffffff",belly:"#f3eefb",line:"#a99cc0",ear:"#ffc6cf",eye:"#3a6fd8"},
  grey:{fur:"#a3adb8",belly:"#d6dbe1",line:"#5d6873",stripe:"#6f7a86",ear:"#f4b6c2",eye:"#2f8f5b"},
  black:{fur:"#34303a",belly:"#4a4552",line:"#16131a",ear:"#d98b9b",eye:"#9ccc3d"},
};
function kittenSVG(L,headOnly){const soft=L.line==="#16131a"?"#9a8fa6":L.line;
  const head=`<g class="head">
    <path d="M84 120L92 52Q96 44 104 50L138 88Z" fill="${L.fur}" stroke="${L.line}" stroke-width="5" stroke-linejoin="round"/><path d="M98 98L102 66L124 90Z" fill="${L.ear}"/>

function playBuffer(buf){return new Promise(res=>{const c=ac(),s=c.createBufferSource();s.buffer=buf;s.connect(c.destination);
  if(current) try{current.stop()}catch(e){}; current=s; s.onended=()=>res(); s.start(); setTimeout(res,buf.duration*1000+300)})}

    if(typeof k==="function") await k();

      if(buf){sofia.classList.add("talk"); await playBuffer(buf); sofia.classList.remove("talk")}}

/* the kitten's own meow: the band's meow, higher for a kitten; lower and slower when it is sad */
async function mew(rate=1.25){const buf=await load("../band/audio/meow.mp3"); if(!buf) return; const c=ac(), s=c.createBufferSource(), g=c.createGain();

function tone(type,f0,f1,t0,dur,vol=.3){

  o.frequency.setValueAtTime(f0,t0); o.frequency.exponentialRampToValueAtTime(f1,t0+dur);
  g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+.02); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);

  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.min(1,i/400)*Math.pow(1-i/n,1.5);
  const s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain(); s.buffer=b; f.type=type; f.frequency.value=freq; g.gain.value=vol;

  yay(){const t=ac().currentTime;[523,659,784,1047].forEach((f,i)=>tone("triangle",f,f,t+i*.12,.3,.25))},

/* ---------- rubbing (wash and dry): the finger, with the sponge or towel under it, rubs the spots away ---------- */
let rub=null, lastBubble=0, lastScrub=0;
function rubbing(){const s=STEPS[stepI]; return !busy&&(s==="wash"||s==="dry")}
function startRub(e){
  if(!rubbing()||rub) return; ac(); e.preventDefault(); clearTimers(); toolEl()?.classList.remove("glow");
  const tool=STEPS[stepI]==="wash"?"sponge":"towel", r=document.createElement("div"); r.id="rubber"; r.innerHTML=TOOLS[tool]; stage.appendChild(r);
  toolEl()?.classList.add("away");
  rub={id:e.pointerId,x:e.clientX,y:e.clientY,moved:0,el:r}; moveRub(e,true);
  try{e.target.setPointerCapture(e.pointerId)}catch(err){}
}
function moveRub(e,first){

  rub.el.style.left=e.clientX+"px"; rub.el.style.top=e.clientY+"px";
  const p=svgPoint(e.clientX,e.clientY), kr=kit.getBoundingClientRect();
  if(e.clientX<kr.left||e.clientX>kr.right||e.clientY<kr.top||e.clientY>kr.bottom) return;
  const scale=300/kr.width;   // screen px to kitten units
  for(const s of spots){ if(s.left<=0) continue;
    if(Math.hypot(p.x-s.x,p.y-s.y)<s.r+38){ s.left=Math.max(0,s.left-d*scale/160); s.e.setAttribute("opacity",s.left.toFixed(2)) } }

/* ---------- dragging (bowl, ball, blanket) or tapping, which sends the thing flying to the kitten ---------- */

  t.classList.add("away"); drag={t,f,x0:e.clientX,y0:e.clientY,cx:r.left+r.width/2,cy:r.top+r.height/2,moved:false,id:e.pointerId,pts:[[performance.now(),e.clientX,e.clientY]]}; sfx.pop();

async function dropDrag(e,cancel){

    d.t.classList.remove("away");
    if(more){busy=false; repeatBtn.hidden=false; idle("play",glowTool); return}
    celebrateKit(); await say([`good-${Math.random()<.5?1:2}`]); showTool(null); nextStep(); return;
  }
  if(kind==="blanket"){
    await glideTo(d.f,kr.left+kr.width*.5,kr.top+kr.height*.85,450); d.f.remove();
    kit.querySelector("#blanket").animate([{opacity:0,transform:"translateY(-30px)"},{opacity:1,transform:"none"}],{duration:500,fill:"forwards"});
    kit.className="sleep breathe"; mew(.9); await wait(600);
    lampTime=true; showTool("lamp"); ready("lamp",glowTool);
  }
}
/* ---------- play: the ball flies the way it was thrown, bounces off the floor and the sides, rolls; the kitten leaps after it ---------- */
function ballStep(b,dt,floor,R,G){
  b.vy+=G*dt; b.x+=b.vx*dt; b.y+=b.vy*dt; b.hit=false;
  if(b.y>floor){b.y=floor; if(b.vy>220){b.vy*=-.5; b.hit=true} else b.vy=0}
  if(b.y<R){b.y=R; b.vy=Math.abs(b.vy)*.5}
  if(b.x<R){b.x=R; b.vx=Math.abs(b.vx)*.6; b.hit=true} else if(b.x>innerWidth-R){b.x=innerWidth-R; b.vx=-Math.abs(b.vx)*.6; b.hit=true}
  if(b.y>=floor) b.vx*=Math.max(0,1-2.4*dt);   // rolling on the floor slows it down
  b.rot+=b.vx*dt/R*57.3;
}
async function playYarn(d,words){
  const f=d.f, kr=kit.getBoundingClientRect(), R=parseFloat(f.style.width)*.3, floor=kr.bottom-kr.height*.06, G=innerHeight*3.2;
  const b={x:parseFloat(f.style.left), y:Math.min(parseFloat(f.style.top),floor), vx:d.vx, vy:d.vy, rot:0};
  const show=()=>{f.style.left=b.x+"px"; f.style.top=b.y+"px"; f.style.rotate=b.rot+"deg"};
  let mode="fly", t=performance.now(); const t0=t; sfx.whoosh();
  await new Promise(res=>{   // the ball flies until the kitten makes up its mind
    const tick=now=>{const dt=Math.min(.035,(now-t)/1000); t=now; ballStep(b,dt,floor,R,G); if(b.hit) sfx.pop(); show();
      const el=(now-t0)/1000; if(el>1.3||(el>.45&&b.y>=floor-2&&Math.abs(b.vx)<120)||(el>.7&&b.y>=floor-2)) res(); else requestAnimationFrame(tick)};
    requestAnimationFrame(tick)});
  /* where will the ball be? the kitten aims there: high in the air it catches it at the top of its leap, on the floor at the landing */
  const J=Math.min(.95,.55+Math.abs(b.x-(kr.left+kr.width/2))/innerWidth*.6), peek=secs=>{const c={...b}; for(let s=0;s<secs;s+=1/60) ballStep(c,1/60,floor,R,G); return c};
  let at=peek(J/2), inAir=at.y<floor-kr.height*.3, cx=kr.left+kr.width/2;
  if(!inAir) at=peek(J);
  const tx=Math.max(kr.width*.5+6,Math.min(innerWidth-kr.width*.5-6,at.x)), jx=tx-cx;
  const hold=inAir?.45:.72;   // where the ball sits on the kitten: up at its paws in a leap, at its feet on the floor
  const peak=inAir?Math.max(kr.height*.3,Math.min(kr.top-4,kr.top+kr.height*hold-at.y)):kr.height*.28;
  const land=inAir?jx*1.1:jx, landX=Math.max(kr.width*.5+6-cx,Math.min(innerWidth-kr.width*.5-6-cx,land));
  mew(1.5);
  const jump=kit.animate([{translate:"0 0",easing:"ease-out"},{translate:`${inAir?jx:jx*.55}px ${-peak}px`,easing:"ease-in"},{translate:`${landX}px 0`}],{duration:J*1000,fill:"forwards"});
  const caughtAt=t+(inAir?J/2:J)*1000*.95;
  await new Promise(res=>{   // the ball goes on until the kitten has it; then it stays in the kitten's paws
    const tick=now=>{const dt=Math.min(.035,(now-t)/1000); t=now;
      if(now<caughtAt){ballStep(b,dt,floor,R,G); if(b.hit) sfx.pop()}
      else{if(mode==="fly"){mode="held"; sfx.boing(); say(words)} const r=kit.getBoundingClientRect(); b.x+=(r.left+r.width*.5-b.x)*.25; b.y+=(r.top+r.height*hold-b.y)*.25}
      show(); if(jump.playState==="finished"&&mode==="held") res(); else requestAnimationFrame(tick)};
    requestAnimationFrame(tick)});
  await wait(500);
  const back=kit.animate([{translate:`${landX}px 0`},{translate:"0 0"}],{duration:Math.min(900,300+Math.abs(landX)),easing:"ease-in-out"});
  const follow=()=>{if(back.playState==="finished") return; const r=kit.getBoundingClientRect(); b.x=r.left+r.width*.5; b.y=r.top+r.height*.72; show(); requestAnimationFrame(follow)}; follow();
  await back.finished.catch(()=>{}); jump.cancel();
  f.remove();
}
let lampTime=false;
async function lightsOut(){
  busy=true; clearTimers(); repeatBtn.hidden=true; sfx.click(); lampTime=false;
  const c=toolEl()?.querySelector(".glowc"); if(c) c.setAttribute("opacity","0");
  $("night").classList.add("on"); sfx.lullaby(); await wait(1200);
  const zz=setInterval(()=>{const r=kit.getBoundingClientRect(), z=document.createElement("div"); z.className="zzz"; z.textContent="z";
    z.style.cssText=`left:${r.left+r.width*.62}px;top:${r.top+r.height*.2}px`; stage.appendChild(z); setTimeout(()=>z.remove(),2700)},900);
  await say(["night"]); await wait(5500); clearInterval(zz);
  $("progress").querySelector(`[data-s="sleep"]`).className="dot done";
  endScreen();
}
/* tapping the kitten when there is nothing to do: it meows and hops */
async function kitTap(e){ if(busy||drag) return; ac(); kit.classList.remove("happy-jump"); void kit.offsetWidth; kit.classList.add("happy-jump"); mew(1.3+Math.random()*.3) }
async function stepDone(){
  busy=true; clearTimers(); const s=STEPS[stepI];
  kit.querySelector(s==="wash"?"#mud":"#wet").innerHTML=""; spots=[];
  if(s==="wash"){kit.className=""; celebrateKit(); mew(1.3); await say(["clean"]); nextStep()}
  else{celebrateKit(); kit.classList.add("happy-jump"); mew(1.4); await say(["fluffy"]); showTool(null); nextStep()}
}
function celebrateKit(){const r=kit.getBoundingClientRect(); celebrate(r.left+r.width/2+"px",r.top+r.height*.35+"px"); sfx.yay()}
sofia.addEventListener("click",()=>{ac(); if(!busy&&stepI>=0) say([STEPS[stepI]==="sleep"&&lampTime?"lamp":STEPS[stepI]])});

async function walkIn(){
  sofia.classList.add("walk");
  await sofia.animate([{translate:"-40vw 0"},{translate:"0 0"}],{duration:1400,easing:"ease-out"}).finished.catch(()=>{});
  sofia.classList.remove("walk");
}

function startScreen(after){
  clearTimers(); sayId++; stopVoice(); repeatBtn.hidden=true; busy=true;
  overlay.hidden=false;
  overlay.innerHTML=`<h1>${after?TITLE[lang]:TITLE.en}</h1><p class="sub">${after?"":"Котёнок · Kaķēns"}</p>

}
function endScreen(){$("night").classList.remove("on"); kit.hidden=true; showTool(null); startScreen(true)}

/* the big "yes!" */
function celebrate(x,y){
  const st=stage, STAR='M12 2l3 7 7 .6-5.4 4.7 1.7 7.2L12 17.8 5.7 21.5l1.7-7.2L2 9.6 9 9z';
  const big=document.createElementNS(NS,"svg"); big.setAttribute("viewBox","0 0 24 24"); big.classList.add("bigstar");
  big.innerHTML=`<path d="${STAR}" fill="#ffd25a" stroke="#f5a623" stroke-width="1.2" stroke-linejoin="round"/><circle cx="9.6" cy="11" r=".9" fill="#5a3a12"/><circle cx="14.4" cy="11" r=".9" fill="#5a3a12"/><path d="M9.8 13.6q2.2 1.8 4.4 0" fill="none" stroke="#5a3a12" stroke-width=".8" stroke-linecap="round"/>`;
  big.style.left=x; big.style.top=y; st.appendChild(big); setTimeout(()=>big.remove(),1200);
  const COL=["#ffd25a","#f06292","#fff","#5fbf7f","#6ec6ff","#ff8a50","#b388ff"];
  for(let i=0;i<40;i++){const s=document.createElementNS(NS,"svg"), z=22+Math.random()*44; s.setAttribute("viewBox","0 0 24 24"); s.classList.add("star");
    s.innerHTML=`<path d="${STAR}" fill="${COL[i%COL.length]}" stroke="#0002" stroke-width=".6"/>`;
    s.style.cssText=`left:${x};top:${y};width:${z}px;height:${z}px;margin:${-z/2}px 0 0 ${-z/2}px;animation-duration:${(1.5+Math.random()*.9).toFixed(2)}s`;
    s.style.setProperty("--dx",(Math.random()*90-45)+"vw"); s.style.setProperty("--dy",(Math.random()*90-45)+"vh");
    st.appendChild(s); setTimeout(()=>s.remove(),2600)}
  for(let i=0;i<34;i++){const c=document.createElement("div"); c.className="confetti";
    c.style.cssText=`left:${Math.random()*100}%;background:${COL[(i+2)%COL.length]};--dx:${(Math.random()*24-12).toFixed(1)}vw;--r:${Math.round(Math.random()*900-450)}deg;--t:${(2+Math.random()*1.2).toFixed(2)}s;--dl:${(Math.random()*.5).toFixed(2)}s`;
    if(i%3===0){c.style.borderRadius="50%"; c.style.height="13px"}
    st.appendChild(c); setTimeout(()=>c.remove(),3900)}
  sofia.animate([{translate:"0 0"},{translate:"0 -9%"},{translate:"0 0"},{translate:"0 -5%"},{translate:"0 0"}],{duration:800,easing:"ease-out"});
  try{const t=ac().currentTime; [1319,1568,1760,2093,2637].forEach((f,i)=>tone("sine",f,f*1.01,t+.05+i*.07,.25,.08))}catch(e){}
}
